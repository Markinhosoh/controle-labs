<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#2B4A85">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2F8; --marca:#4A7FD6; --marca-dark:#2B4A85; --card:#FFFFFF; --ink:#2C2A22; --ink-soft:#5B564A;
    --green:#4B5842; --green-dark:#3A4633; --green-tint:#DCE3D5;
    --terracota:#C1633D; --terracota-dark:#A84F30; --terracota-tint:#F3DCCF;
    --amber-dark:#8A6E12; --amber-tint:#F1E7C0; --border:#D8E0EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  a{color:inherit;}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);}
  label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--marca-dark);color:#fff;}
  .btn-outline{background:#fff;color:var(--ink);border:1px solid var(--border);}
  .btn-terracota{background:var(--terracota-dark);color:#fff;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .chip{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block;}
  .chip-ok{background:var(--green-tint);color:var(--green-dark);}
  .chip-atencao{background:var(--amber-tint);color:var(--amber-dark);}
  .chip-urgente,.chip-destaque{background:var(--terracota-tint);color:var(--terracota-dark);}
  .chip-atrasado{background:var(--terracota-dark);color:#fff;}
  .chip-cobrado{background:var(--green-tint);color:var(--green-dark);font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap;}
  .chip-avisar{background:var(--amber-tint);color:var(--amber-dark);font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap;}
  .badge-aviso{background:var(--terracota);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:6px;}
  .chip-entregue{background:#E6E9EF;color:var(--ink-soft);}
  nav a{padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;opacity:0.85;text-decoration:none;}
  nav a.active{background:rgba(255,255,255,0.18);font-weight:700;opacity:1;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--border);}
  td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;}
  tr:hover td{background:#F5F8FD;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(44,42,34,0.35);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:14px;padding:28px;width:480px;max-width:90vw;display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;}
  .imp-linha.invalida{border:2px solid var(--terracota-dark) !important;background:var(--terracota-tint);}
  .imp-linha.invalida input[id^="imp-cliente-"], .imp-linha.invalida input[id^="cor-cliente-"]{border-color:var(--terracota-dark);}
  .fab{position:fixed;bottom:28px;right:28px;background:var(--terracota-dark);color:#fff;border-radius:999px;padding:14px 22px;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(168,79,48,0.35);z-index:20;}
  .btn-instalar{width:100%;background:linear-gradient(135deg,var(--marca) 0%,var(--marca-dark) 100%);color:#fff;font-weight:800;font-size:15px;letter-spacing:.4px;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.25);box-shadow:0 6px 18px rgba(74,127,214,.45);animation:pulso-instalar 2s infinite;}
  @keyframes pulso-instalar{0%{box-shadow:0 0 0 0 rgba(74,127,214,.55),0 6px 18px rgba(74,127,214,.4);}70%{box-shadow:0 0 0 14px rgba(74,127,214,0),0 6px 18px rgba(74,127,214,.4);}100%{box-shadow:0 0 0 0 rgba(74,127,214,0),0 6px 18px rgba(74,127,214,.4);}}
</style>
</head>
<body>
<div id="app">Carregando…</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
// A biblioteca de PDF (pdf.js) é carregada só na hora do upload (ver carregarPdfjs):
// se ela falhar num computador, o resto do app continua funcionando.

// Versão visível no app (login e rodapé) — ajuda a saber, por um print, qual versão a loja está usando
const VERSAO_APP = '2026-10-23';
// Desde quando o app registra as atividades das lojas (antes disso, a aba Equipes usa só o que está nos pedidos)
const INICIO_REGISTRO = '2026-10-20';

// ---------- MARCA: tudo que muda de um grupo de lojas para outro ----------
const MARCA = {
  nome: 'Centro Ótico',
  logo: 'logo-branco.png',            // logo branca (aparece sobre o azul escuro)
  // Cada loja tem uma conta de login no Firebase com o e-mail  <slug>@<dominioEmail>
  // (ex.: marica@controledelab.com). O "domínio" é só um nome: nenhum e-mail é enviado.
  dominioEmail: 'controledelab.com',
  // Contas de administrador (veem todas as lojas): <nome>@<dominioEmail>. As regras do Firestore
  // (firestore.rules) têm a MESMA lista: se mudar aqui, mude lá também.
  admins: ['admin'],
  enderecoOficial: 'markinhosoh.github.io',                // ex.: 'usuario.github.io' (preencha depois de publicar; vazio = sem aviso de cópia)
  lojas: [
    // nome = como aparece e como fica gravado em cada pedido · slug = parte do e-mail de login
    // msg = como a loja se apresenta ao laboratório no WhatsApp · pdf = trecho do cabeçalho do relatório (SSOtica)
    { nome: 'Maricá',    slug: 'marica',   msg: 'C.O Maricá',   pdf: /maric/i },
    { nome: 'Art Ótica', slug: 'artotica', msg: 'Art Ótica SG', pdf: /\bart\W+.?tica/i },
    { nome: 'Rio Bonito', slug: 'rb',       msg: 'C.O Rio Bonito', pdf: /rio\W*bonito/i },
    { nome: 'Tanguá',    slug: 'tangua',   msg: 'C.O Tanguá',   pdf: /tangu/i }
  ]
};

// ---------- config do Firebase (projeto NOVO deste grupo; veja o LEIA-ME) ----------
const firebaseConfig = {
  apiKey: "AIzaSyAufqi11DZ7saoyxwaHKKLjxeKMDcAVdOQ",
  authDomain: "co-controle-labs.firebaseapp.com",
  projectId: "co-controle-labs",
  storageBucket: "co-controle-labs.firebasestorage.app",
  messagingSenderId: "763302173692",
  appId: "1:763302173692:web:ebf1596457a84c1e49f079"
};
const FIREBASE_PENDENTE = /COLE_AQUI/.test(firebaseConfig.apiKey);
let firebaseApp = null, fs = null, auth = null;
if (!FIREBASE_PENDENTE){
  firebaseApp = initializeApp(firebaseConfig);
  fs = getFirestore(firebaseApp);
  auth = getAuth(firebaseApp);
}

// navegadores mais antigos não têm Promise.withResolvers, que o pdf.js usa
if (typeof Promise.withResolvers !== 'function'){
  Promise.withResolvers = function(){
    var resolve, reject;
    var promise = new Promise(function(res, rej){ resolve = res; reject = rej; });
    return { promise: promise, resolve: resolve, reject: reject };
  };
}

// sem internet o Firebase segura a gravação indefinidamente; aqui ela desiste e avisa
var MSG_SEM_CONEXAO = 'O servidor não respondeu a tempo. Verifique a internet e tente de novo — o que já foi salvo não será duplicado.';
function comTempoLimite(promise, ms, mensagem){
  return new Promise(function(resolve, reject){
    var t = setTimeout(function(){ reject(new Error(mensagem)); }, ms);
    promise.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
  });
}
function gravar(ref, dados, opcoes){
  return comTempoLimite(opcoes ? setDoc(ref, dados, opcoes) : setDoc(ref, dados), 20000, MSG_SEM_CONEXAO);
}
function apagar(ref){
  return comTempoLimite(deleteDoc(ref), 20000, MSG_SEM_CONEXAO);
}
// gera o id do documento antes de gravar: se a pessoa tentar de novo, grava no mesmo lugar em vez de duplicar
function novoIdPedido(){
  return doc(collection(fs, 'pedidos')).id;
}

(function(){
  var state = {
    view: 'dashboard',
    selectedId: null,
    filter: 'todos',
    adminLojaFiltro: 'todas',
    session: null,
    loginForm: { role: 'loja', loja: MARCA.lojas[0].nome, usuario: 'admin', codigo: '' },
    loginError: null,
    modal: null,
    novoForm: {},
    contatoForm: {},
    contatoAction: null,
    destaqueAction: null,
    destaqueForm: {},
    avisoAction: null,
    modoEdicao: false,
    pdfProcessando: false,
    pdfError: null,
    pdfCandidatos: [],
    saving: false,
    error: null,
    dbReady: false
  };
  var pedidosCache = [];
  var configCache = { codigosLabs: {}, ultimaImportacao: {} };
  // LOJAS = lojas que esta sessão enxerga (admin: todas; loja: só a dela). LOJAS_TODAS = as 4 do grupo.
  var LOJAS_TODAS = MARCA.lojas.map(function(l){ return l.nome; });
  var LOJAS = LOJAS_TODAS.slice();
  function lojaPorNome(nome){ return MARCA.lojas.filter(function(l){ return l.nome === nome; })[0] || null; }
  function lojaPorSlug(slug){ return MARCA.lojas.filter(function(l){ return l.slug === slug; })[0] || null; }
  var LABORATORIOS_FIXOS = ['Orgalent - Essilor', 'Hoya', 'Zeiss', 'Rodenstock', 'Visco', 'Imperiallab', 'Digilab', 'Niteroilab', 'Masterlab', 'Jefferson (serviços menores)'];

  function escopoPedidos(){
    if (!state.session) return [];
    if (state.session.role === 'admin'){
      if (state.adminLojaFiltro && state.adminLojaFiltro !== 'todas'){
        return pedidosCache.filter(function(p){ return p.loja === state.adminLojaFiltro; });
      }
      return pedidosCache;
    }
    return pedidosCache.filter(function(p){ return p.loja === state.session.loja; });
  }

  function toISO(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function todayStr(){
    var d = new Date();
    return new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
  }
  // Uma data vazia ou inválida faria os laços abaixo rodarem para sempre e congelar a tela da loja.
  // Com data inválida as contas devolvem a própria data / 0, sem travar.
  function dataValida(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00')); }
  function addBusinessDays(dateStr, n){
    if (!dataValida(dateStr)) return dateStr || '';
    n = Math.min(Math.max(parseInt(n, 10) || 0, 0), 2000);
    var d = new Date(dateStr + 'T00:00:00');
    var added = 0;
    while (added < n){
      d.setDate(d.getDate()+1);
      var day = d.getDay();
      if (day !== 0 && day !== 6) added++;
    }
    return toISO(d);
  }
  function subBusinessDays(dateStr, n){
    if (!dataValida(dateStr)) return dateStr || '';
    n = Math.min(Math.max(parseInt(n, 10) || 0, 0), 2000);
    var d = new Date(dateStr + 'T00:00:00');
    var sub = 0;
    while (sub < n){
      d.setDate(d.getDate()-1);
      var day = d.getDay();
      if (day !== 0 && day !== 6) sub++;
    }
    return toISO(d);
  }
  function businessDaysBetween(fromStr, toStr){
    if (!dataValida(fromStr) || !dataValida(toStr)) return 0;
    var from = new Date(fromStr + 'T00:00:00');
    var to = new Date(toStr + 'T00:00:00');
    var sign = to >= from ? 1 : -1;
    var count = 0;
    var d = new Date(from);
    while (toISO(d) !== toISO(to)){
      d.setDate(d.getDate()+sign);
      var day = d.getDay();
      if (day !== 0 && day !== 6) count += sign;
    }
    return count;
  }
  function fmtDate(iso){
    if(!iso) return '—';
    var parts = iso.split('-');
    return parts[2] + '/' + parts[1];
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Status do pedido. "Atrasado" = passou da previsão VIGENTE (o novo prazo do laboratório, se houver;
  // senão a previsão original). Os Relatórios continuam medindo o atraso pela previsão original.
  function pedidoStatus(p, hojeTeste){
    if (p.entregue) return { status: 'entregue' };
    var hojeS = typeof hojeTeste === 'string' ? hojeTeste : todayStr(); // (map() passa o índice como 2º argumento)
    if (p.areaDestaque) {
      var nova = p.contato && p.contato.novaPrevisao;
      if (dataValida(nova) && hojeS > nova) return { status: 'atrasado', previsao: nova, novoPrazo: true, atraso: businessDaysBetween(nova, hojeS) };
      return { status: 'destaque', previsao: nova, novoPrazo: true, diasRestantes: dataValida(nova) ? businessDaysBetween(hojeS, nova) : null };
    }
    if (dataValida(p.previsaoOriginal) && hojeS > p.previsaoOriginal){
      return { status: 'atrasado', previsao: p.previsaoOriginal, atraso: businessDaysBetween(p.previsaoOriginal, hojeS), checkUrgencia: checkpointUrgencia(p) };
    }
    var checkAtencao, checkUrgencia;
    if (p.tipo === 'especial') {
      var prazoDias = p.prazoDias || businessDaysBetween(p.dataPedido, p.previsaoOriginal);
      checkUrgencia = subBusinessDays(p.previsaoOriginal, prazoDias > 3 ? 2 : 1);
      checkAtencao = subBusinessDays(p.previsaoOriginal, prazoDias > 3 ? Math.ceil(prazoDias / 2) : (prazoDias > 1 ? 1 : 0));
    } else {
      checkAtencao = addBusinessDays(p.dataPedido, p.tipo === 'pronta' ? 3 : 5);
      checkUrgencia = subBusinessDays(p.previsaoOriginal, 2);
    }
    var hoje = hojeS;
    var status = 'ok';
    if (hoje >= checkUrgencia) status = 'urgente';
    else if (hoje >= checkAtencao) status = 'atencao';
    var diasRestantes = businessDaysBetween(hoje, p.previsaoOriginal);
    return { status: status, previsao: p.previsaoOriginal, checkAtencao: checkAtencao, checkUrgencia: checkUrgencia, diasRestantes: diasRestantes };
  }

  function statusLabel(s){
    return { ok: 'No prazo', atencao: 'Atenção', urgente: 'Urgente', destaque: 'Em destaque', atrasado: 'Atrasado', entregue: 'Entregue' }[s] || s;
  }
  function statusChipClass(s){
    return { ok: 'chip-ok', atencao: 'chip-atencao', urgente: 'chip-urgente', destaque: 'chip-destaque', atrasado: 'chip-atrasado', entregue: 'chip-entregue' }[s] || 'chip-ok';
  }

  // (O botão individual "Cobrar no WhatsApp" saiu em 15/10/2026: a cobrança agora é em lote, por
  // laboratório, em "Cobrar laboratórios" — o time copia a mensagem e cola na conversa.)

  // Já aconteceu de uma loja usar uma cópia antiga (arquivo salvo, outro site ou aba aberta há dias)
  // enquanto o site tinha a versão corrigida. O app agora avisa nesses casos.
  var ENDERECO_OFICIAL = MARCA.enderecoOficial || '';
  function verificarVersao(){
    var h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1') return;
    if (ENDERECO_OFICIAL && (location.protocol === 'file:' || h !== ENDERECO_OFICIAL)){
      if (state.avisoVersao !== 'copia'){ state.avisoVersao = 'copia'; render(); }
      return;
    }
    if (location.protocol === 'file:') return;
    fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(html){
      var m = html.match(/VERSAO_APP = '([^']+)'/);
      if (m && m[1] !== VERSAO_APP && state.avisoVersao !== 'nova'){ state.avisoVersao = 'nova'; state.versaoNova = m[1]; render(); }
    }).catch(function(){});
  }
  function avisoVersaoHtml(){
    if (state.avisoVersao === 'copia') return '<div style="background:var(--terracota-dark);color:#fff;padding:10px 16px;font-size:13px;font-weight:700;text-align:center;">⚠ Esta é uma cópia do app fora do endereço oficial e pode estar desatualizada. Use sempre <a href="https://' + ENDERECO_OFICIAL + '" style="color:#fff;text-decoration:underline;">' + ENDERECO_OFICIAL + '</a></div>';
    if (state.avisoVersao === 'nova') return '<div style="background:var(--amber-tint);color:var(--amber-dark);padding:10px 16px;font-size:13px;font-weight:700;text-align:center;">Há uma versão nova do app (' + escapeHtml(state.versaoNova || '') + '). <button id="btn-atualizar-app" style="font-weight:800;text-decoration:underline;color:inherit;">Clique para atualizar</button></div>';
    return '';
  }

  // ---------- login (Firebase Auth) e assinaturas dos dados ----------
  var unsubs = [];
  function cancelarAssinaturas(){
    unsubs.forEach(function(u){ try{ u(); }catch(e){} });
    unsubs = [];
    pedidosCache = [];
    configCache = { codigosLabs: {}, ultimaImportacao: {} };
  }
  // quem é a pessoa logada, a partir do e-mail da conta (a regra de verdade está em firestore.rules)
  function sessaoDoEmail(email){
    var pref = String(email || '').toLowerCase().split('@')[0];
    if (MARCA.admins.indexOf(pref) >= 0) return { role: 'admin', email: email };
    var l = lojaPorSlug(pref);
    return l ? { role: 'loja', loja: l.nome, email: email } : null;
  }
  // O servidor só entrega o que a conta pode ver: loja => só pedidos com loja == a dela; admin => tudo.
  function assinarDados(){
    var admin = state.session.role === 'admin';
    var colPedidos = collection(fs, 'pedidos');
    var qPedidos = admin ? colPedidos : query(colPedidos, where('loja', '==', state.session.loja));
    unsubs.push(onSnapshot(qPedidos, function(snap){
      pedidosCache = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      state.dbReady = true;
      renderDoBanco();
    }, function(err){
      state.error = 'Erro ao carregar pedidos: ' + err.message;
      state.dbReady = true;
      render();
    }));
    var aoReceberConfig = function(docs){
      var c = { codigosLabs: {}, ultimaImportacao: {} };
      docs.forEach(function(d){
        var l = lojaPorSlug(d.id); if (!l) return;
        var v = d.data() || {};
        c.codigosLabs[l.nome] = v.codigosLabs || {};
        if (v.ultimaImportacao) c.ultimaImportacao[l.nome] = v.ultimaImportacao;
      });
      configCache = c;
      renderDoBanco();
    };
    var erroConfig = function(err){ state.error = 'Erro ao carregar configurações: ' + err.message; render(); };
    if (admin){
      unsubs.push(onSnapshot(collection(fs, 'configLoja'), function(snap){ aoReceberConfig(snap.docs); }, erroConfig));
    } else {
      unsubs.push(onSnapshot(doc(fs, 'configLoja', lojaPorNome(state.session.loja).slug), function(snap){
        aoReceberConfig(snap.exists() ? [snap] : []);
      }, erroConfig));
    }
  }

  function init(){
    render();
    if (FIREBASE_PENDENTE){
      state.error = 'Falta configurar o Firebase deste grupo (firebaseConfig no começo do arquivo index.html). Veja o LEIA-ME.';
      state.dbReady = true; render(); return;
    }
    verificarVersao();
    setInterval(verificarVersao, 10 * 60 * 1000);
    // aba que fica aberta de um dia para o outro: o acesso do dia novo conta no primeiro clique ou tecla,
    // e não à meia-noite — assim o horário de abertura mostrado ao admin é o de quem realmente começou a usar
    document.addEventListener('pointerdown', registrarAcesso, true);
    document.addEventListener('keydown', registrarAcesso, true);
    onAuthStateChanged(auth, function(user){
      cancelarAssinaturas();
      var s = user ? sessaoDoEmail(user.email) : null;
      if (user && !s){
        state.loginError = 'Este usuário não está liberado para nenhuma loja.';
        signOut(auth).catch(function(){});
      }
      if (s){
        state.session = s;
        LOJAS = s.role === 'admin' ? LOJAS_TODAS.slice() : [s.loja];
        state.error = null;
        state.dbReady = false;
        render();
        assinarDados();
        registrarAcesso();
      } else {
        state.session = null;
        LOJAS = LOJAS_TODAS.slice();
        state.view = 'dashboard'; state.selectedId = null; state.modal = null; state.adminLojaFiltro = 'todas';
        state.equipes = null;
        state.dbReady = true;
        render();
      }
    });
  }

  // ---------- actions ----------
  // 0 → A, 1 → B, … 25 → Z, 26 → AA
  function letraIndice(i){
    var s = '';
    i = i + 1;
    while (i > 0){ var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  // Como a loja numera os óculos de uma mesma OS: o 1º é o próprio número (8751),
  // o 2º é 8751A, o 3º 8751B… (sem espaço)
  function codigoDoItem(numeroOS, posicao){
    var base = String(numeroOS || '').trim();
    return posicao === 0 ? base : base + letraIndice(posicao - 1);
  }
  function gerarItens(numeroOS, quantidade){
    var qtd = Math.max(1, parseInt(quantidade, 10) || 1);
    var itens = [];
    for (var i = 0; i < qtd; i++){
      itens.push({
        codigo: codigoDoItem(numeroOS, i),
        entregue: false,
        dataEntrega: null
      });
    }
    return itens;
  }

  // ---------- registro de atividades (aba Equipes) ----------
  // Cada ação vira um registro em "atividades": loja, tipo, OS, dia e hora. Só a loja — nunca a pessoa.
  // "por" diz se foi o login da loja ou o admin; o índice da equipe só conta ações da loja.
  // Falhar aqui nunca atrapalha a ação da loja.
  function registrarAtividade(tipo, p, extra){
    try{
      if (!state.session) return;
      var porAdmin = state.session.role === 'admin';
      var loja = p ? p.loja : state.session.loja;
      if (!loja) return;
      var dados = Object.assign({ tipo: tipo, loja: loja, por: porAdmin ? 'admin' : 'loja', dia: todayStr(), quando: new Date().toISOString() },
        p ? { pedidoId: p.id, os: p.numeroOS || '' } : {}, extra || {});
      setDoc(doc(collection(fs, 'atividades')), dados).catch(function(){});
    } catch(e){}
  }
  // "Último upload" que a loja vê ao lado da busca. Fica em configLoja/<loja> (que todo login já
  // carrega). A loja é a do relatório; sem ela, a do login. PDF sem nenhuma OS lida não conta.
  function registrarUltimaImportacao(diag){
    try{
      if (!state.session || !diag || !diag.osNoPdf || !diag.dataMin) return;
      var loja = state.pdfLoja || (state.session.role === 'loja' ? state.session.loja : null);
      if (!loja) return;
      var info = { dia: todayStr(), quando: new Date().toISOString(), dataMin: diag.dataMin, dataMax: diag.dataMax, osNoPdf: diag.osNoPdf };
      var ult = {}; ult[loja] = info;
      configCache.ultimaImportacao = Object.assign({}, configCache.ultimaImportacao || {}, ult);
      setDoc(doc(fs, 'configLoja', lojaPorNome(loja).slug), { ultimaImportacao: info }, { merge: true }).catch(function(){});
    } catch(e){}
  }

  // um "acesso" por loja por dia: ao abrir/entrar no app, ou no 1º clique do dia numa aba que ficou aberta.
  // O horário ("quando") desse registro é o que o admin vê em Equipes → "Quem abriu o app".
  function registrarAcesso(){
    if (!state.session || state.session.role !== 'loja') return;
    var chave = 'co_acesso_' + state.session.loja + '_' + todayStr();
    try{ if (localStorage.getItem(chave)) return; localStorage.setItem(chave, '1'); } catch(e){}
    registrarAtividade('acesso');
  }

  async function criarPedido(form){
    var faltando = !form.cliente ? 'o nome do cliente' : !form.dataPedido ? 'a data do pedido' : !form.loja ? 'a loja' : (form.tipo === 'especial' && !form.prazoDias) ? 'o prazo especial (dias úteis)' : null;
    if (faltando){ state.novoForm.erro = 'Preencha ' + faltando + '.'; render(); return; }
    state.novoForm.erro = null;
    state.saving = true; render();
    var prazoDias = form.tipo === 'especial' ? parseInt(form.prazoDias, 10) : (form.tipo === 'pronta' ? 7 : 10);
    var previsaoOriginal = addBusinessDays(form.dataPedido, prazoDias);
    var itens = gerarItens(form.numeroOS, form.quantidade);
    if (!state.novoForm._docId) state.novoForm._docId = novoIdPedido();
    try{
      await gravar(doc(fs, 'pedidos', state.novoForm._docId), {
        cliente: form.cliente,
        numeroOS: form.numeroOS || '',
        quantidade: itens.length,
        itens: itens,
        tipo: form.tipo,
        loja: form.loja,
        laboratorio: form.laboratorio || 'Não informado',
        dataPedido: form.dataPedido,
        previsaoOriginal: previsaoOriginal,
        prazoDias: form.tipo === 'especial' ? prazoDias : null,
        entregue: false,
        areaDestaque: false,
        contato: null,
        lembretes: {},
        historico: {},
        criadoEm: todayStr()
      });
      registrarAtividade('novo_pedido', { id: state.novoForm._docId, loja: form.loja, numeroOS: form.numeroOS });
      state.modal = null; state.novoForm = {};
    } catch(e){ state.novoForm.erro = 'Não foi possível salvar: ' + e.message; }
    state.saving = false; render();
  }

  function itensDoPedido(p){
    if (p.itens && p.itens.length) return p.itens;
    return [{ codigo: p.numeroOS || '', entregue: !!p.entregue, dataEntrega: p.dataEntrega || null }];
  }

  async function marcarItemEntregue(pedidoId, idx, chegou){
    var p = pedidosCache.find(function(x){ return x.id === pedidoId; });
    if (!p) return;
    state.saving = true; render();
    try{
      var itens = itensDoPedido(p).map(function(it, i){
        if (i !== idx) return it;
        return Object.assign({}, it, { entregue: chegou, dataEntrega: chegou ? todayStr() : null });
      });
      var todosEntregues = itens.every(function(it){ return it.entregue; });
      var patch = { itens: itens, quantidade: itens.length };
      if (todosEntregues){
        patch.entregue = true; patch.dataEntrega = todayStr(); patch.areaDestaque = false;
        if (!p.entregue) patch.aviso = avisoChegou(p); // chegou: o cliente precisa saber que já pode retirar
      } else if (p.entregue) {
        patch.entregue = false; patch.dataEntrega = null;
      }
      await gravar(doc(fs, 'pedidos', pedidoId), patch, { merge: true });
      if (chegou) registrarAtividade('chegou', p);
    } catch(e){ state.error = e.message; }
    state.saving = false; render();
  }

  async function marcarMesmoPrazo(id){
    state.saving = true; render();
    try{
      await gravar(doc(fs, 'pedidos', id), { contato: { tipo: 'mesmo', registradoEm: todayStr() } }, { merge: true });
      registrarAtividade('contato_mesmo', pedidosCache.find(function(x){ return x.id === id; }));
    } catch(e){ state.error = e.message; }
    state.saving = false; state.contatoAction = null; render();
  }

  async function marcarNovoPrazo(id, form){
    if (!form.novaData) return;
    state.saving = true; render();
    try{
      var pAntes = pedidosCache.find(function(x){ return x.id === id; });
      var avisoNovo = pAntes ? avisoAposNovoPrazo(pAntes, form.novaData) : null;
      var patchPrazo = {
        contato: { tipo: 'novo', novaPrevisao: form.novaData, observacao: form.observacao || '', registradoEm: todayStr() },
        areaDestaque: true
      };
      if (avisoNovo) patchPrazo.aviso = avisoNovo; // a loja agora precisa avisar o cliente da nova data
      await gravar(doc(fs, 'pedidos', id), patchPrazo, { merge: true });
      registrarAtividade('contato_novo', pAntes, { novaPrevisao: form.novaData });
      if (avisoNovo && avisoNovo.pendente) registrarAtividade('aviso_pendente', pAntes, { tipoAviso: 'prazo' });
      state.contatoAction = null; state.contatoForm = {};
    } catch(e){ state.error = e.message; }
    state.saving = false; render();
  }

  async function marcarEntregue(id){
    var p = pedidosCache.find(function(x){ return x.id === id; });
    if (!p) return;
    state.saving = true; render();
    try{
      var hoje = todayStr();
      var itens = itensDoPedido(p).map(function(it){ return Object.assign({}, it, { entregue: true, dataEntrega: it.dataEntrega || hoje }); });
      var patchEntrega = { entregue: true, dataEntrega: hoje, areaDestaque: false, itens: itens, quantidade: itens.length };
      if (!p.entregue) patchEntrega.aviso = avisoChegou(p); // chegou: o cliente precisa saber que já pode retirar
      await gravar(doc(fs, 'pedidos', id), patchEntrega, { merge: true });
      registrarAtividade('chegou', p);
    } catch(e){ state.error = e.message; }
    state.saving = false; render();
  }

  async function marcarContatoHoje(id, observacao){
    state.saving = true; render();
    try{
      var hoje = todayStr();
      var lembretes = {}; lembretes[hoje] = true;
      var historico = {}; historico[hoje] = { observacao: observacao || '', registradoEm: hoje };
      await gravar(doc(fs, 'pedidos', id), { lembretes: lembretes, historico: historico }, { merge: true });
      registrarAtividade('contato_destaque', pedidosCache.find(function(x){ return x.id === id; }));

  async function editarPedido(id, dados){
    var p = pedidosCache.find(function(x){ return x.id === id; });
    // trocou o Nº OS: renumera os óculos pela posição, mantendo o que já chegou
    if (p && p.itens && p.itens.length && dados.numeroOS !== (p.numeroOS || '')){
      dados.itens = p.itens.map(function(it, i){ return Object.assign({}, it, { codigo: codigoDoItem(dados.numeroOS, i) }); });
    }
    state.saving = true; render();
    try{
      await gravar(doc(fs, 'pedidos', id), dados, { merge: true });
      state.modoEdicao = false;
    } catch(e){ state.error = e.message; }
    state.saving = false; render();
  }

  async function excluirPedido(id){
    var p = pedidosCache.find(function(x){ return x.id === id; });
    if (!p) return;
    if (state.session.role !== 'admin' && p.loja !== state.session.loja) return;
    state.saving = true; render();
    try{
      await apagar(doc(fs, 'pedidos', id));
      registrarAtividade('exclusao', p, { cliente: p.cliente || '' });
      state.saving = false;
      state.confirmarExclusao = false;
      setView('dashboard');
    } catch(e){ state.error = e.message; state.saving = false; render(); }
  }

  // ---------- importação de PDF (SSOtica) ----------
  async function processarPdf(file){
    state.pdfProcessando = true; state.pdfError = null; state.importedJustNow = false; render();
    try{
      var linhas = await comTempoLimite(lerLinhasPdf(file), 60000,
        'a leitura passou de 1 minuto e foi cancelada. Tente de novo; se continuar, atualize o navegador (Chrome ou Edge) deste computador.');
      state.pdfCandidatos = extrairCandidatosPdf(linhas);
      registrarAtividade('importacao', null, { osNoPdf: (state.pdfDiag && state.pdfDiag.osNoPdf) || 0, lojaDoPdf: state.pdfLoja || '' });
      registrarUltimaImportacao(state.pdfDiag);
      state.pdfProcessando = false;
      state.modal = 'importarPdf';
      render();
    } catch(e){
      state.pdfError = 'Não foi possível ler o PDF: ' + e.message;
      state.pdfProcessando = false;
      render();
    }
  }

  // ==== LEITOR-PDF-INICIO ==== (testes/teste-leitor.html roda este trecho com os PDFs reais das lojas)

  // Tenta, em ordem: versão moderna, versão para navegadores antigos, e outro site (se a rede bloquear o 1º)
  var FONTES_PDFJS = [
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/',
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/legacy/build/',
    'https://unpkg.com/pdfjs-dist@4.0.379/legacy/build/'
  ];
  var pdfjsCarregando = null;
  function navegadorTxt(){
    var m = navigator.userAgent.match(/(Edg|OPR|Chrome|Firefox|Version)\/(\d+)/);
    return m ? (m[1] === 'Edg' ? 'Edge' : m[1] === 'Version' ? 'Safari' : m[1]) + ' ' + m[2] : navigator.userAgent;
  }
  function carregarPdfjs(){
    if (pdfjsCarregando) return pdfjsCarregando;
    pdfjsCarregando = (async function(){
      var erros = [];
      for (var i = 0; i < FONTES_PDFJS.length; i++){
        try{
          var lib = await import(FONTES_PDFJS[i] + 'pdf.min.mjs');
          lib.GlobalWorkerOptions.workerSrc = FONTES_PDFJS[i] + 'pdf.worker.min.mjs';
          return lib;
        } catch(e){ erros.push(e && e.message || String(e)); }
      }
      throw new Error('o leitor de PDF não carregou neste computador (navegador: ' + navegadorTxt() + '). Atualize o Chrome/Edge ou verifique a internet. Detalhe: ' + erros[0]);
    })();
    pdfjsCarregando.catch(function(){ pdfjsCarregando = null; }); // permite tentar de novo
    return pdfjsCarregando;
  }

  async function lerLinhasPdf(file, libTeste){
      var pdfjsLib = libTeste || await carregarPdfjs();
      var buf = await file.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      var linhas = []; // cada item: lista de {x, texto} de uma mesma linha visual do PDF
      for (var pageNum = 1; pageNum <= pdf.numPages; pageNum++){
        var page = await pdf.getPage(pageNum);
        var content = await page.getTextContent();
        var porY = {};
        content.items.forEach(function(item){
          var y = Math.round(item.transform[5]);
          if (!porY[y]) porY[y] = [];
          porY[y].push({ x: item.transform[4], texto: item.str });
        });
        var ys = Object.keys(porY).map(Number).sort(function(a,b){ return b - a; });
        ys.forEach(function(y){
          var itens = porY[y].sort(function(a,b){ return a.x - b.x; }).filter(function(it){ return it.texto && it.texto.trim(); });
          if (itens.length) linhas.push(itens);
        });
      }
      return linhas;
  }

  // mapeia os nomes das seções de laboratório do relatório do SSOtica para os nossos laboratórios fixos
  var MAPA_LAB_PDF = [
    { re: /imperial/i, lab: 'Imperiallab' },
    { re: /hoya/i, lab: 'Hoya' },
    { re: /zeiss/i, lab: 'Zeiss' },
    { re: /rodenstock/i, lab: 'Rodenstock' },
    { re: /visco/i, lab: 'Visco' },
    { re: /digilab/i, lab: 'Digilab' },
    { re: /niter[oó]i\s*lab/i, lab: 'Niteroilab' },
    { re: /master\s*lab/i, lab: 'Masterlab' },
    { re: /orgalent/i, lab: 'Orgalent - Essilor' },
    { re: /jefferson/i, lab: 'Jefferson (serviços menores)' }
  ];
  // marcadores usados para reconhecer cada coluna da tabela pelo texto do cabeçalho
  var COLUNAS_MARCADORES = [
    { key: 'data', re: /^data/i },
    { key: 'nro', re: /^nro/i },
    { key: 'cod', re: /cod\.?\s*ext/i },
    { key: 'filial', re: /filial/i },
    { key: 'cliente', re: /^cliente/i },
    { key: 'bruto', re: /bruto/i },
    { key: 'acre', re: /acre|desc/i },
    { key: 'liq', re: /liq/i },
    { key: 'adiant', re: /adiant|a\s*rec/i }
  ];

  // Lê o relatório de ordens de serviço olhando a posição (x) de cada texto no PDF para
  // reconstruir as colunas da tabela (Data, Nº OS, Cliente, etc), já que o texto puro,
  // lido em sequência, mistura as colunas quando o nome do cliente quebra em duas linhas.
  function clienteSemNome(nome){
    return !nome || /verificar no relat|cliente n[ãa]o identificado/i.test(nome);
  }

  function extrairCandidatosPdf(linhas){
    var labAtual = 'Não informado';
    var colunas = null; // [{key,x}] ordenado por x, aprendido a partir da linha de cabeçalho da tabela
    // o cabeçalho do relatório diz de qual loja ele é (ex.: "Centro Ótico Maricá"); a numeração de OS é por loja
    var lojaPdf = null;
    // só olha as primeiras linhas (cabeçalho), para não confundir com endereço de cliente
    linhas.slice(0, 25).some(function(itens){
      var t = itens.map(function(it){ return it.texto; }).join(' ');
      // tolerante a acentos que o PDF às vezes transforma em outros caracteres ("Maric?", "Tangu?")
      for (var k = 0; k < MARCA.lojas.length; k++){
        if (MARCA.lojas[k].pdf.test(t)){ lojaPdf = MARCA.lojas[k].nome; break; }
      }
      return !!lojaPdf;
    });
    state.pdfLoja = lojaPdf;
    var existentes = {};
    pedidosCache.forEach(function(p){
      if (!p.numeroOS) return;
      if (lojaPdf && p.loja !== lojaPdf) return;
      existentes[String(p.numeroOS)] = p;
    });
    var correcoes = [];
    state.pdfCorrecoes = correcoes;
    var encontrados = [];
    var linhaAtual = null;
    var diag = { linhasTexto: linhas.length, cabecalho: false, osNoPdf: 0, jaExistentes: 0 };
    state.pdfDiag = diag;

    // Números (Nº OS, valores) são alinhados à direita no SSOtica e podem começar um pouco
    // antes do título da coluna; por isso cada coluna começa até 10pt antes do seu título
    // (sem passar da metade do caminho até a coluna anterior).
    function coluna(x){
      var achada = null;
      for (var i = 0; i < colunas.length; i++){
        var folga = i > 0 ? Math.min(10, (colunas[i].x - colunas[i-1].x) / 2) : 10;
        if (x + 0.5 >= colunas[i].x - folga) achada = colunas[i]; else break;
      }
      return achada ? achada.key : null;
    }

    function fecharLinhaAtual(){
      if (!linhaAtual) return;
      var mNro = (linhaAtual.nro || '').match(/(\d{3,7})/);
      var mData = (linhaAtual.data || '').match(/(\d{2}\/\d{2}\/\d{4})/);
      if (mNro && mData){
        var os = mNro[1];
        diag.osNoPdf++;
        // período das OS do relatório (mostrado como "Último upload … OS de X a Y")
        var dataIso = mData[1].split('/').reverse().join('-');
        if (!diag.dataMin || dataIso < diag.dataMin) diag.dataMin = dataIso;
        if (!diag.dataMax || dataIso > diag.dataMax) diag.dataMax = dataIso;
        if (existentes[os]){
          diag.jaExistentes++;
          // pedido já cadastrado sem nome do cliente: oferece corrigir com o nome lido agora
          var nomeLido = (linhaAtual.cliente || '').replace(/\s+/g, ' ').trim();
          var pExistente = existentes[os];
          if (nomeLido && clienteSemNome(pExistente.cliente) && !correcoes.some(function(c){ return c.id === pExistente.id; })){
            correcoes.push({ id: pExistente.id, numeroOS: os, clienteAtual: pExistente.cliente || '', cliente: nomeLido, incluir: true });
          }
        }
        if (!existentes[os] && !encontrados.some(function(r){ return r.numeroOS === os; })){
          encontrados.push({
            numeroOS: os,
            dataPedido: mData[1].split('/').reverse().join('-'),
            laboratorio: linhaAtual.laboratorio,
            cliente: (linhaAtual.cliente || '').replace(/\s+/g, ' ').trim(),
            bruto: (linhaAtual.bruto || '').replace(/\s+/g, ' ').trim()
          });
        }
      }
      linhaAtual = null;
    }

    linhas.forEach(function(itens){
      var texto = itens.map(function(it){ return it.texto; }).join(' ').replace(/\s+/g, ' ').trim();
      if (!texto) return;

      // rodapé ("Ipê Digital © … ssotica … Página 1 de 2") e cabeçalho da página seguinte
      // (endereço, CNPJ, título): encerram o pedido aberto para não colar texto no nome do cliente
      if (/ssotica|p[áa]gina\s+\d+\s+de\s+\d+|listagem de ordens|relat[óo]rio de ordens|cnpj|situa[çc][ãa]o:|total o\.?s\.?/i.test(texto)){
        fecharLinhaAtual();
        return;
      }

      // linha de cabeçalho da tabela ("Data/Status  Nro.  Cliente  ...") — aprende as colunas
      if (/data/i.test(texto) && /cliente/i.test(texto) && /nro/i.test(texto)){
        var achadas = [];
        itens.forEach(function(it){
          COLUNAS_MARCADORES.forEach(function(m){
            if (m.re.test(it.texto) && !achadas.some(function(a){ return a.key === m.key; })){
              achadas.push({ key: m.key, x: it.x });
            }
          });
        });
        if (achadas.length >= 4){ colunas = achadas.sort(function(a,b){ return a.x - b.x; }); diag.cabecalho = true; }
        fecharLinhaAtual();
        return;
      }

      // cabeçalho de seção de laboratório ("Imperial Lab - 19 R$ 22.895,00"): linha curta, sem data,
      // com o total em R$ — ou, sem R$, começando na margem esquerda e sem horário. Isso evita que um
      // sobrenome que quebrou de linha ("Viscondi", "Hoyama") troque o laboratório. O nome é procurado
      // em qualquer parte da linha, já que ícones do relatório podem virar caracteres estranhos.
      var pareceCabecalhoLab = /R\$/.test(texto) || (itens[0].x < 130 && !/\d{1,2}:\d{2}/.test(texto));
      if (texto.length < 60 && !/\d{2}\/\d{2}\/\d{4}/.test(texto) && pareceCabecalhoLab){
        var achouLab = MAPA_LAB_PDF.some(function(m){
          if (m.re.test(texto)){ labAtual = m.lab; return true; }
          return false;
        });
        if (achouLab){ fecharLinhaAtual(); return; }
        if (/laborat[oó]rio n[ãa]o informado/i.test(texto)){ labAtual = 'Não informado'; fecharLinhaAtual(); return; }
      }

      if (!colunas) return; // ainda não encontramos o cabeçalho da tabela

      var porColuna = {};
      itens.forEach(function(it){
        var k = coluna(it.x);
        if (!k) return;
        porColuna[k] = (porColuna[k] ? porColuna[k] + ' ' : '') + it.texto;
      });

      var comecaNovaLinha = porColuna.data && /\d{2}\/\d{2}\/\d{4}/.test(porColuna.data);
      if (comecaNovaLinha){
        fecharLinhaAtual();
        linhaAtual = { data: porColuna.data || '', nro: porColuna.nro || '', cliente: porColuna.cliente || '', laboratorio: labAtual, bruto: texto };
      } else if (linhaAtual){
        // linha de continuação (nome do cliente que quebrou em duas linhas, por exemplo)
        if (porColuna.cliente) linhaAtual.cliente += ' ' + porColuna.cliente;
        if (porColuna.nro && !linhaAtual.nro) linhaAtual.nro = porColuna.nro;
        linhaAtual.bruto += ' ' + texto;
      }
    });
    fecharLinhaAtual();

    // Rede de segurança: se a tabela não foi entendida (cabeçalho diferente, colunas deslocadas),
    // procura de forma simples linhas com "data + nº da OS". O nome do cliente fica para conferir
    // no "Texto lido no PDF".
    if (!diag.osNoPdf){
      var labSimples = 'Não informado';
      linhas.forEach(function(itens){
        var texto = itens.map(function(it){ return it.texto; }).join(' ').replace(/\s+/g, ' ').trim();
        var temData = /\d{2}\/\d{2}\/\d{4}/.test(texto);
        if (texto.length < 60 && !temData){
          if (/R\$/.test(texto) || (itens[0].x < 130 && !/\d{1,2}:\d{2}/.test(texto))){
            MAPA_LAB_PDF.some(function(m){ if (m.re.test(texto)){ labSimples = m.lab; return true; } return false; });
          }
          return;
        }
        var m = texto.match(/(\d{2}\/\d{2}\/\d{4})\s+(\d{3,7})\b/);
        if (!m) return;
        linhaAtual = { data: m[1], nro: m[2], cliente: '', laboratorio: labSimples, bruto: texto };
        fecharLinhaAtual();
      });
      if (diag.osNoPdf) diag.modoSimples = true;
    }

    return encontrados.map(function(r){
      return {
        numeroOS: r.numeroOS,
        quantidade: 1,
        dataPedido: r.dataPedido,
        laboratorio: r.laboratorio,
        cliente: r.cliente || '',
        clienteGuess: r.cliente || '(verificar no relatório)',
        textoLido: r.bruto || '',
        tipo: 'surfacada',
        incluir: true
      };
    });
  }

  async function salvarImportados(candidatos){
    var selecionados = candidatos.filter(function(c){ return c.incluir && !c.salvo; });
    var correcoes = (state.pdfCorrecoes || []).filter(function(c){ return c.incluir && !c.salvo && c.cliente; });
    var semNome = selecionados.filter(function(c){ return clienteSemNome((c.cliente || '').trim()); }).length +
      (state.pdfCorrecoes || []).filter(function(c){ return c.incluir && !c.salvo && clienteSemNome((c.cliente || '').trim()); }).length;
    if (semNome){
      state.importErro = 'Há ' + semNome + ' linha(s) selecionada(s) sem nome do cliente. Preencha ou desmarque antes de salvar.';
      render(); return;
    }
    var total = selecionados.length + correcoes.length;
    state.saving = true; state.importErro = null; state.importProgresso = { feitos: 0, total: total }; render();
    try{
      for (var j = 0; j < correcoes.length; j++){
        await gravar(doc(fs, 'pedidos', correcoes[j].id), { cliente: correcoes[j].cliente }, { merge: true });
        correcoes[j].salvo = true;
        state.importProgresso.feitos++; render();
      }
      for (var i = 0; i < selecionados.length; i++){
        var c = selecionados[i];
        var prazoDias = c.tipo === 'especial' ? (parseInt(c.prazoDias, 10) || 10) : (c.tipo === 'pronta' ? 7 : 10);
        var previsaoOriginal = addBusinessDays(c.dataPedido, prazoDias);
        var itens = gerarItens(c.numeroOS, c.quantidade);
        if (!c._docId) c._docId = novoIdPedido();
        await gravar(doc(fs, 'pedidos', c._docId), {
          cliente: c.cliente.trim(),
          numeroOS: c.numeroOS || '',
          quantidade: itens.length,
          itens: itens,
          tipo: c.tipo,
          loja: c.loja,
          laboratorio: c.laboratorio || 'Não informado',
          dataPedido: c.dataPedido,
          previsaoOriginal: previsaoOriginal,
          prazoDias: c.tipo === 'especial' ? prazoDias : null,
          entregue: false,
          areaDestaque: false,
          contato: null,
          lembretes: {},
          historico: {},
          criadoEm: todayStr(),
          origemImportacao: true
        });
        c.salvo = true;
        state.importProgresso.feitos++; render();
      }
      state.modal = null; state.pdfCandidatos = []; state.pdfCorrecoes = []; state.importedJustNow = true;
    } catch(e){
      var feitos = state.importProgresso.feitos;
      state.importErro = (feitos ? feitos + ' de ' + state.importProgresso.total + ' itens foram salvos. ' : '') + 'Erro ao salvar: ' + e.message;
    }
    state.saving = false; state.importProgresso = null; render();
  }

  function semAcento(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

  // Busca por OS (inclui os códigos dos óculos, ex.: 8751A) ou pelo nome do cliente.
  // Procura também nos já entregues, para achar qualquer serviço.
  function pedidoBateBusca(p, termo){
    var t = semAcento(termo).replace(/\s+/g, '');
    if (!t) return true;
    if (semAcento(p.numeroOS).replace(/\s+/g, '').indexOf(t) >= 0) return true;
    if (itensDoPedido(p).some(function(it){ return semAcento(it.codigo).replace(/\s+/g, '').indexOf(t) >= 0; })) return true;
    return semAcento(p.cliente).replace(/\s+/g, '').indexOf(t) >= 0;
  }

  function fmtDataCompleta(iso){ if (!dataValida(iso)) return '—'; var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

  function infoUltimaImportacao(loja){
    var reg = (configCache.ultimaImportacao || {})[loja] || null;
    var ultimoDia = null;
    pedidosCache.forEach(function(p){ if (p.loja === loja && p.origemImportacao && dataValida(p.criadoEm) && (!ultimoDia || p.criadoEm > ultimoDia)) ultimoDia = p.criadoEm; });
    var antigo = null;

      var datas = pedidosCache.filter(function(p){ return p.loja === loja && p.origemImportacao && p.criadoEm === ultimoDia && dataValida(p.dataPedido); })
        .map(function(p){ return p.dataPedido; }).sort();
      antigo = { dia: ultimoDia, dataMin: datas[0], dataMax: datas[datas.length - 1] };
    }
    if (reg && dataValida(reg.dia) && (!antigo || reg.dia >= antigo.dia)) return reg;
    return antigo;

  // ==== COBRANCA-INICIO ==== (testes/teste-leitor.html também testa este trecho)
  // Cobrança em lote: os urgentes e atrasados de cada laboratório viram UMA mensagem, que o time copia e
  // cola na conversa com o laboratório. Depois, "Marcar como cobrados hoje" registra a cobrança de todos.
  // A mensagem leva só o que o laboratório usa: OS, data do pedido, previsão e situação.
  function cobradoNoDia(p, dia){
    return !!((p.lembretes && p.lembretes[dia]) || (p.contato && p.contato.registradoEm === dia));
  }
  function codigosPendentes(p){
    var itens = itensDoPedido(p);
    if (itens.length > 1 && itens.some(function(it){ return it.entregue; })){
      return itens.filter(function(it){ return !it.entregue; }).map(function(it){ return it.codigo; }).join(', ');
    }
    return p.numeroOS || '—';
  }
  function situacaoCobranca(s){
    if (s.status === 'atrasado') return 'atrasado ' + diasUteisTxt(s.atraso);
    if (s.diasRestantes != null && s.diasRestantes <= 0) return 'vence hoje';
    return 'vence em ' + diasUteisTxt(s.diasRestantes);
  }
  function gruposCobranca(pedidos, hoje){
    var mapa = {};
    pedidos.forEach(function(p){
      if (p.entregue) return;
      var s = pedidoStatus(p, hoje);
      if (s.status !== 'urgente' && s.status !== 'atrasado') return;
      var lab = p.laboratorio || 'Não informado';
      var chave = p.loja + '|' + lab;
      if (!mapa[chave]) mapa[chave] = { chave: chave, loja: p.loja, laboratorio: lab, itens: [] };
      mapa[chave].itens.push({
        p: p, s: s, cobradoHoje: cobradoNoDia(p, hoje),
        linha: 'OS ' + codigosPendentes(p) + ' · pedido ' + fmtDate(p.dataPedido) + ' · ' + (s.novoPrazo ? 'novo prazo ' : 'previsão ') + fmtDate(s.previsao) + ' · ' + situacaoCobranca(s)
      });
    });
    return Object.keys(mapa).map(function(k){
      mapa[k].itens.sort(function(a, b){ return (a.s.previsao || '').localeCompare(b.s.previsao || '') || String(a.p.numeroOS).localeCompare(String(b.p.numeroOS)); });
      return mapa[k];
    }).sort(function(a, b){ return a.loja.localeCompare(b.loja) || a.laboratorio.localeCompare(b.laboratorio); });
  }
  function mensagemLote(grupo, itens){
    var codigo = ((configCache.codigosLabs || {})[grupo.loja] || {})[grupo.laboratorio];
    var semLab = grupo.laboratorio === 'Não informado';
    return (semLab ? 'Olá!' : 'Olá, ' + grupo.laboratorio + '!') + ' Aqui é da ' + ((lojaPorNome(grupo.loja) || {}).msg || grupo.loja) + (codigo ? ' COD ' + codigo : '') + '.\n' +
      (itens.length === 1 ? 'Pedimos a posição do pedido abaixo:' : 'Pedimos a posição dos pedidos abaixo:') + '\n\n' +
      itens.map(function(it, i){ return (i + 1) + '. ' + it.linha; }).join('\n') +
      '\n\nObrigado!';

  // ==== AVISO-CLIENTE-INICIO ====
  // Aviso ao cliente. Toda novidade que o cliente precisa saber (novo prazo do laboratório, óculos que
  // chegou, novidade registrada à mão) deixa o pedido "pendente de aviso" até alguém confirmar que avisou.
  // Fica em pedido.aviso = { pendente, tipo: 'prazo'|'chegou'|'info', motivo, desde, prazo, prazoPrometido, historico: [] }
  //   prazoPrometido = a data que o cliente acredita ser a de entrega (a última que a loja contou a ele).
  var CANAIS_AVISO = [['whatsapp', 'WhatsApp'], ['ligacao', 'Ligação'], ['pessoalmente', 'Pessoalmente'], ['dispensado', 'Cliente já sabe / já retirou']];
  function nomeCanal(c){ var x = CANAIS_AVISO.filter(function(o){ return o[0] === c; })[0]; return x ? x[1] : (c || ''); }
  function horaAgora(){ return new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' }).format(new Date()); }
  function prazoVigente(p){ return (p.areaDestaque && p.contato && dataValida(p.contato.novaPrevisao)) ? p.contato.novaPrevisao : p.previsaoOriginal; }

  // Aviso pendente de um pedido (ou null). Pedido que já estava na Área em Destaque antes deste recurso,
  // sem nenhum registro de aviso, aparece como pendente: a loja confirma se o cliente já foi avisado.
  function avisoEfetivo(p){
    if (p.aviso) return p.aviso.pendente ? p.aviso : null;
    if (p.areaDestaque && !p.entregue && p.contato && p.contato.tipo === 'novo' && dataValida(p.contato.novaPrevisao)){
      return { pendente: true, tipo: 'prazo', legado: true, motivo: 'Novo prazo registrado antes: confirme se o cliente já foi avisado',
        desde: dataValida(p.contato.registradoEm) ? p.contato.registradoEm : todayStr(), prazo: p.contato.novaPrevisao, prazoPrometido: p.previsaoOriginal || null };
    }
    return null;
  }
  // 'hoje' = a data que o cliente tem em mente é hoje ou já passou; 'amanha' = é no próximo dia útil.
  function riscoAviso(a, hoje){
    if (!a || a.tipo === 'chegou' || !dataValida(a.prazoPrometido)) return null;
    if (hoje >= a.prazoPrometido) return 'hoje';
    return businessDaysBetween(hoje, a.prazoPrometido) <= 1 ? 'amanha' : null;
  }
  function pedidosParaAvisar(pedidos, hoje){
    var lista = [];
    pedidos.forEach(function(p){
      var a = avisoEfetivo(p);
      if (!a) return;
      lista.push({ p: p, a: a, risco: riscoAviso(a, hoje), dias: Math.max(0, businessDaysBetween(a.desde, hoje)) });
    });
    var peso = { hoje: 0, amanha: 1 };
    lista.sort(function(x, y){
      var rx = x.risco ? peso[x.risco] : 2, ry = y.risco ? peso[y.risco] : 2;
      return rx - ry || y.dias - x.dias || String(x.p.cliente).localeCompare(String(y.p.cliente));
    });
    return lista;
  }
  function avisoAposNovoPrazo(p, novaData){
    var atual = p.aviso || avisoEfetivo(p) || {};
    var prometido = dataValida(atual.prazoPrometido) ? atual.prazoPrometido : (prazoVigente(p) || null);
    var historico = (p.aviso && p.aviso.historico) || [];
    if (novaData === prometido) return { pendente: false, tipo: 'prazo', motivo: '', desde: null, prazo: novaData, prazoPrometido: prometido, historico: historico }; // o cliente já sabe essa data
    return { pendente: true, tipo: 'prazo', motivo: 'Novo prazo do laboratório: ' + fmtDataCompleta(novaData),
      desde: (atual.pendente && atual.tipo === 'prazo' && dataValida(atual.desde)) ? atual.desde : todayStr(),
      prazo: novaData, prazoPrometido: prometido, historico: historico };
  }
  function avisoChegou(p){
    var atual = p.aviso || {};
    return { pendente: true, tipo: 'chegou', motivo: 'Chegou na loja: avise o cliente para retirar', desde: todayStr(), prazo: null,
      prazoPrometido: atual.prazoPrometido || null, historico: atual.historico || [] };
  }
  function primeiroNome(c){
    var n = String(c || '').trim().split(/\s+/)[0] || '';
    return n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : '';
  }
  function mensagemCliente(p, a){
    var oi = 'Olá' + (primeiroNome(p.cliente) ? ', ' + primeiroNome(p.cliente) : '') + '! Aqui é da ' + MARCA.nome + ' ' + p.loja + '.';
    var os = p.numeroOS ? ' (OS ' + p.numeroOS + ')' : '';
    if (a.tipo === 'chegou') return oi + ' Boas notícias: o seu óculos' + os + ' chegou! Pode vir retirar quando quiser.';
    if (a.tipo === 'info') return oi + ' Sobre o seu óculos' + os + ': ' + String(a.motivo || '').replace(/[.\s]+$/, '') + '.';
    return oi + ' Sobre o seu óculos' + os + ': o laboratório nos informou um novo prazo. A previsão de entrega agora é ' + fmtDataCompleta(a.prazo) +
      '. Pedimos desculpas pelo ajuste e avisamos assim que ele chegar. Qualquer dúvida, é só falar!';
  }

  async function confirmarAviso(id, canal, obs){
    var p = pedidosCache.find(function(x){ return x.id === id; });
    var a = p ? avisoEfetivo(p) : null;
    if (!p || !a) return;
    var hoje = todayStr();
    var tipo = a.tipo || 'prazo';
    var historico = ((p.aviso && p.aviso.historico) || []).concat([{ em: hoje, hora: horaAgora(), canal: canal, obs: obs || '', tipo: tipo, motivo: a.motivo || '', prazo: a.prazo || null, desde: a.desde || hoje }]);
    var aviso = { pendente: false, tipo: tipo, motivo: '', desde: null, prazo: a.prazo || null,
      prazoPrometido: tipo === 'chegou' ? (a.prazoPrometido || null) : (a.prazo || a.prazoPrometido || null), historico: historico };
    state.saving = true; render();
    try{
      await gravar(doc(fs, 'pedidos', id), { aviso: aviso }, { merge: true });
      registrarAtividade('cliente_avisado', p, { canal: canal, tipoAviso: tipo, diasParaAvisar: Math.max(0, businessDaysBetween(a.desde, hoje)) });
      state.avisoAction = null;
    } catch(e){ state.error = e.message; }
    state.saving = false; render();
  }

  async function registrarNovidade(id, texto){
    var p = pedidosCache.find(function(x){ return x.id === id; });
    if (!p || !texto) return;
    var atual = p.aviso || {};
    var aviso = { pendente: true, tipo: 'info', motivo: texto, desde: todayStr(), prazo: null,
      prazoPrometido: dataValida(atual.prazoPrometido) ? atual.prazoPrometido : (prazoVigente(p) || null), historico: atual.historico || [] };
    state.saving = true; render();
    try{
      await gravar(doc(fs, 'pedidos', id), { aviso: aviso }, { merge: true });
      registrarAtividade('aviso_pendente', p, { tipoAviso: 'info' });
      state.avisoAction = null;
    } catch(e){ state.error = e.message; }
    state.saving = false; render();
  }

  // Cartão de um aviso pendente (usado na aba "Avisar clientes" e no detalhe do pedido).
  function cartaoAviso(x, noDetalhe){
    var p = x.p, a = x.a;
    var acao = state.avisoAction && state.avisoAction.id === p.id ? state.avisoAction.tipo : null;
    var chipRisco = x.risco === 'hoje' ? '<span class="chip chip-atrasado">🚨 O cliente pode ir à loja hoje</span>'
      : x.risco === 'amanha' ? '<span class="chip chip-urgente">⚠ Prazo que o cliente tem em mente: amanhã</span>' : '';
    var antes = (a.tipo !== 'chegou' && dataValida(a.prazoPrometido)) ? fmtDataCompleta(a.prazoPrometido) : null;
    var linhaPrazo = '';
    if (a.tipo === 'prazo' && antes && dataValida(a.prazo)) linhaPrazo = '<div style="font-size:13px;margin-top:6px;">O cliente acredita que fica pronto em <b>' + antes + '</b>. A nova previsão é <b>' + fmtDataCompleta(a.prazo) + '</b>.</div>';
    else if (antes) linhaPrazo = '<div style="font-size:13px;margin-top:6px;">Data que o cliente tem em mente: <b>' + antes + '</b>.</div>';
    var pendHa = x.dias <= 0 ? 'desde hoje' : 'há ' + diasUteisTxt(x.dias) + ' (desde ' + fmtDate(a.desde) + ')';
    var forms = '';
    if (acao === 'avisado'){
      forms = '<div style="display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--bg);border-radius:10px;margin-top:10px;">' +
        '<div><label>Como o cliente foi avisado?</label><select id="aviso-canal-' + p.id + '" style="width:100%;">' +
          CANAIS_AVISO.map(function(o){ return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('') + '</select></div>' +
        '<div><label>Observação (opcional)</label><textarea id="aviso-obs-' + p.id + '" rows="2" placeholder="Ex.: falei com a esposa, ele vem sábado"></textarea></div>' +
        '<div style="display:flex;gap:8px;">' +
          '<button data-aviso-cancelar="1" class="btn btn-outline" style="flex:1;">Cancelar</button>' +
          '<button data-aviso-confirmar="' + p.id + '" class="btn btn-primary" style="flex:1;" ' + (state.saving ? 'disabled' : '') + '>' + (state.saving ? 'Salvando…' : 'Confirmar aviso') + '</button>' +
        '</div></div>';
    }
    return '<div class="card" style="border-color:' + (x.risco === 'hoje' ? 'var(--terracota-dark)' : x.risco ? 'var(--terracota)' : 'var(--amber-dark)') + ';' + (noDetalhe ? '' : 'margin-bottom:14px;') + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">' +
        '<div><div style="font-size:16px;font-weight:800;">📞 ' + escapeHtml(p.cliente) + (p.numeroOS ? ' · OS ' + escapeHtml(p.numeroOS) : '') + '</div>' +
        '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">' + escapeHtml(p.loja) + ' · Laboratório: ' + escapeHtml(p.laboratorio || '—') + '</div></div>' +
        chipRisco +
      '</div>' +
      '<div style="font-size:14px;font-weight:700;margin-top:10px;">' + escapeHtml(a.motivo || 'Há novidade para o cliente') + '</div>' +
      linhaPrazo +
      '<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Cliente sem aviso ' + pendHa + '.</div>' +
      '<div style="margin-top:10px;"><label>Mensagem pronta (pode editar antes de copiar)</label>' +
        '<textarea id="aviso-msg-' + p.id + '" rows="3" style="width:100%;font-size:13px;">' + escapeHtml(mensagemCliente(p, a)) + '</textarea></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
        '<button data-aviso-copiar="' + p.id + '" class="btn btn-outline">📋 Copiar mensagem</button>' +
        (acao ? '' : '<button data-aviso-abrir="' + p.id + '" data-tipo="avisado" class="btn btn-terracota">✓ Cliente avisado</button>') +
        (noDetalhe ? '' : '<button data-open="' + p.id + '" class="btn btn-outline">Abrir pedido</button>') +
      '</div>' +
      forms +
    '</div>';
  }

  function historicoAvisosHtml(p){
    var hist = ((p.aviso && p.aviso.historico) || []).slice().reverse().slice(0, 6);
    if (!hist.length) return '';
    return '<div style="display:flex;flex-direction:column;gap:6px;">' + hist.map(function(h){
      return '<div style="font-size:12px;background:var(--bg);border-radius:8px;padding:8px 12px;"><b>' + fmtDate(h.em) + (h.hora ? ' ' + escapeHtml(h.hora) : '') + '</b> · cliente avisado por ' + escapeHtml(nomeCanal(h.canal)) +
        (h.motivo ? ' · ' + escapeHtml(h.motivo) : '') + (h.obs ? ' · “' + escapeHtml(h.obs) + '”' : '') + '</div>';
    }).join('') + '</div>';
  }

  // Cartão do detalhe do pedido: aviso pendente, ou "em dia" + histórico + botão para registrar novidade
  function avisoDetalheHtml(p){
    var hoje = todayStr();
    var a = avisoEfetivo(p);
    if (a) return '<div style="margin-top:16px;">' + cartaoAviso({ p: p, a: a, risco: riscoAviso(a, hoje), dias: Math.max(0, businessDaysBetween(a.desde, hoje)) }, true) + '</div>' +
      (historicoAvisosHtml(p) ? '<div class="card" style="margin-top:12px;"><div style="font-size:13px;font-weight:800;margin-bottom:8px;">Avisos já feitos ao cliente</div>' + historicoAvisosHtml(p) + '</div>' : '');
    var acao = state.avisoAction && state.avisoAction.id === p.id ? state.avisoAction.tipo : null;
    var formNov = acao === 'novidade'
      ? '<div style="display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--bg);border-radius:10px;">' +
          '<div><label>O que o cliente precisa saber?</label><textarea id="novidade-texto-' + p.id + '" rows="2" placeholder="Ex.: a lente veio com defeito e será refeita"></textarea></div>' +
          '<div style="display:flex;gap:8px;"><button data-aviso-cancelar="1" class="btn btn-outline" style="flex:1;">Cancelar</button>' +
          '<button data-novidade-salvar="' + p.id + '" class="btn btn-terracota" style="flex:1;" ' + (state.saving ? 'disabled' : '') + '>Deixar pendente de aviso</button></div></div>'
      : '';
    var hist = historicoAvisosHtml(p);
    return '<div class="card" style="margin-top:16px;display:flex;flex-direction:column;gap:10px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">' +
        '<div><div style="font-size:15px;font-weight:800;">Aviso ao cliente</div>' +
        '<div style="font-size:12px;color:var(--green-dark);font-weight:700;margin-top:2px;">✓ Nenhuma novidade pendente: o cliente está em dia.</div></div>' +
        (acao || p.entregue ? '' : '<button data-aviso-abrir="' + p.id + '" data-tipo="novidade" class="btn btn-outline">💬 Há novidade para o cliente</button>') +
      '</div>' + formNov + hist + '</div>';
  }

  function viewAvisos(){
    var hoje = todayStr();
    var lista = pedidosParaAvisar(escopoPedidos(), hoje);
    var risco = lista.filter(function(x){ return x.risco; }).length;
    var topo = '<div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;"><div>' +
      '<div style="font-size:20px;font-weight:800;">Avisar clientes</div>' +
      '<div style="font-size:13px;color:var(--ink-soft);margin-top:4px;max-width:720px;">Quando o laboratório muda o prazo ou o óculos chega, o cliente precisa saber <b>antes</b> de ir à loja. Copie a mensagem, envie ao cliente e toque em “Cliente avisado”.</div></div>' + lojaBotoesHtml() + '</div>';
    var resumo = lista.length
      ? '<div style="padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:13px;font-weight:700;' + (risco ? 'background:var(--terracota-tint);color:var(--terracota-dark);border:1px solid var(--terracota);' : 'background:var(--amber-tint);color:var(--amber-dark);border:1px solid var(--border);') + '">' +
          lista.length + (lista.length === 1 ? ' cliente sem aviso' : ' clientes sem aviso') +
          (risco ? ' · ' + risco + (risco === 1 ? ' pode ir à loja hoje ou amanhã sem saber da mudança (aparece primeiro)' : ' podem ir à loja hoje ou amanhã sem saber da mudança (aparecem primeiro)') : '') + '</div>'
      : '';
    var corpo = lista.length ? lista.map(function(x){ return cartaoAviso(x, false); }).join('')
      : '<div class="card" style="text-align:center;color:var(--green-dark);font-weight:700;">✓ Todos os clientes estão avisados. Ótimo trabalho!</div>';
    return topo + resumo + corpo;
  }

  // Equipes (admin): como cada loja está avisando os clientes
  function avisosEquipeHtml(atividades, hoje, per){
    var linhas = LOJAS.map(function(loja){
      var pend = pedidosParaAvisar(pedidosCache.filter(function(p){ return p.loja === loja; }), hoje);
      var maisAntigo = pend.reduce(function(m, x){ return Math.max(m, x.dias); }, 0);
      var comRisco = pend.filter(function(x){ return x.risco; }).length;
      var feitos = (atividades || []).filter(function(a){ return a.tipo === 'cliente_avisado' && a.loja === loja && a.por === 'loja' && a.dia >= per.ini && a.dia <= per.fim; });
      var rapidos = feitos.filter(function(a){ return (a.diasParaAvisar || 0) <= 1; }).length;
      var soma = feitos.reduce(function(s, a){ return s + (a.diasParaAvisar || 0); }, 0);
      return '<tr><td style="font-weight:700;">' + escapeHtml(loja) + '</td>' +
        '<td style="' + (pend.length ? 'color:var(--terracota-dark);font-weight:700;' : 'color:var(--green-dark);font-weight:700;') + '">' + pend.length + (comRisco ? ' (' + comRisco + ' com risco)' : '') + '</td>' +
        '<td>' + (pend.length ? diasUteisTxt(maisAntigo) : '—') + '</td>' +
        '<td>' + feitos.length + '</td>' +
        '<td>' + (feitos.length ? Math.round(rapidos / feitos.length * 100) + '%' : '—') + '</td>' +
        '<td>' + (feitos.length ? (Math.round(soma / feitos.length * 10) / 10).toString().replace('.', ',') + ' dia(s) útil(eis)' : '—') + '</td></tr>';
    }).join('');
    return '<div class="card" style="padding:0;overflow:auto;margin-top:16px;">' +
      '<div style="padding:14px 16px 4px;font-size:15px;font-weight:800;">Avisos aos clientes <span style="font-weight:400;font-size:12px;color:var(--ink-soft);">— clientes que precisam saber de novo prazo ou da chegada do óculos</span></div>' +
      '<table><thead><tr><th>Loja</th><th>Sem aviso agora</th><th>Mais antigo</th><th>Avisos feitos no período</th><th>Avisados em até 1 dia útil</th><th>Tempo médio para avisar</th></tr></thead><tbody>' + linhas + '</tbody></table></div>';
  }
  // ==== AVISO-CLIENTE-FIM ====

  function viewDashboard(){
    var busca = (state.busca || '').trim();
    var rows = escopoPedidos().filter(function(p){ return busca ? pedidoBateBusca(p, busca) : !p.entregue; }).map(function(p){
      return Object.assign({}, p, { _s: pedidoStatus(p) });
    });
    if (!busca && state.filter !== 'todos') rows = rows.filter(function(p){ return p._s.status === state.filter; });
    rows.sort(function(a,b){
      if (!!a.entregue !== !!b.entregue) return a.entregue ? 1 : -1;
      return (a._s.previsao||'').localeCompare(b._s.previsao||'');
    });

    var filterChips = [['todos','Todos'],['atencao','Atenção'],['urgente','Urgente'],['destaque','Em destaque'],['atrasado','Atrasados']].map(function(f){

      return '<button data-filter="'+f[0]+'" class="btn '+(active?'btn-primary':'btn-outline')+'" style="border-radius:999px;">'+f[1]+'</button>';

      (busca ? '<button id="limpar-busca" title="Limpar busca" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--ink-soft);">✕</button>' : '') +

      var situacao = s.status === 'atrasado' ? '<span style="color:var(--terracota-dark);font-weight:800;">Atrasado ' + diasUteisTxt(s.atraso) + '</span>'

      return '<tr data-open="'+p.id+'" style="cursor:pointer;'+rowBg+'">' +
        '<td style="font-weight:700;">'+escapeHtml(p.cliente)+(p.numeroOS?' <span style="font-weight:400;color:var(--ink-soft);">· OS '+escapeHtml(p.numeroOS)+escapeHtml(progressoTxt)+'</span>':'')+'</td>' +
        '<td style="color:var(--ink-soft);">'+tipoLabel+'</td>' +
        '<td style="color:var(--ink-soft);">'+p.loja+'</td>' +
        '<td style="color:var(--ink-soft);font-weight:600;">'+escapeHtml(p.laboratorio||'—')+'</td>' +
        '<td style="color:var(--ink-soft);">'+fmtDate(p.dataPedido)+'</td>' +
        '<td style="color:var(--ink-soft);">'+fmtDate(s.previsao)+(s.novoPrazo ? ' <span style="font-size:11px;">(novo prazo)</span>' : '')+'</td>' +
        '<td style="color:var(--ink-soft);">'+situacao+'</td>' +
        '<td><span class="chip '+statusChipClass(s.status)+'">'+statusLabel(s.status)+'</span></td>' +
        '<td>'+(cobradoHoje ? '<span class="chip-cobrado">✓ cobrado hoje</span> ' : '')+(avisoEfetivo(p) ? '<span class="chip-avisar">📞 avisar cliente</span>' : '')+'</td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="9" style="text-align:center;color:var(--ink-soft);padding:32px;">' +
      (busca
        ? 'Nenhuma OS ou cliente encontrado para “' + escapeHtml(busca) + '”' + (state.session.role === 'admin' && state.adminLojaFiltro !== 'todas' ? ' na loja ' + escapeHtml(state.adminLojaFiltro) + ' (experimente “Todas”)' : '') + '.'
        : state.filter !== 'todos'
        ? 'Nenhum pedido com status "' + statusLabel(state.filter) + '" agora.'
        : 'Nenhum pedido em aberto. Use o botão "+ Novo Pedido" para cadastrar.') +
      '</td></tr>';

    var imported = state.importedJustNow;
    var pdfMsg = state.pdfProcessando
      ? 'Lendo o PDF, aguarde alguns segundos…'
      : state.pdfError
        ? state.pdfError
        : (imported
          ? 'Última importação concluída. Os pedidos novos identificados foram adicionados à listagem — confira e ajuste o que for preciso.'
          : 'Suba aqui o PDF exportado do SSOtica. O app tenta identificar automaticamente Nº OS, data e laboratório de cada pedido novo (a leitura é experimental — sempre revise antes de confirmar, especialmente o nome do cliente).');
    var importBlock = '' +
    '<div style="position:relative;background:#fff;border:1px dashed var(--green-dark);border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;">' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
        '<div style="width:36px;height:36px;border-radius:8px;background:var(--green-tint);display:flex;align-items:center;justify-content:center;font-size:16px;">📄</div>' +
        '<div>' +
          '<div style="font-size:13px;font-weight:700;">Importar relatório do SSOtica</div>' +
          '<div style="font-size:12px;color:'+(state.pdfError?'var(--terracota-dark)':'var(--ink-soft)')+';margin-top:2px;">'+escapeHtml(pdfMsg)+'</div>' +

  function tipoLenteLabel(t){ return t === 'pronta' ? 'Pronta' : (t === 'especial' ? 'Especial' : 'Surfaçada'); }

  // Data em que a OS ficou completa: com vários óculos, é a do último que chegou.
  // Sem data confiável → null (o pedido fica fora do relatório).
  function dataEntregaDaOS(p){
    if (!p.entregue) return null;
    var itens = p.itens || [];
    if (itens.length > 1){
      if (!itens.every(function(it){ return it.entregue; })) return null;
      var datas = itens.map(function(it){ return it.dataEntrega; }).filter(Boolean).sort();
      if (datas.length === itens.length) return datas[datas.length - 1];
    }
    return p.dataEntrega || null;
  }

  // Uma linha por OS entregue, sempre em dias úteis. A régua do atraso é a previsão original
  // (o objetivo é cobrar o laboratório); o novo prazo informado aparece só como referência.
  function linhasRelatorio(pedidos){
    var linhas = [];
    pedidos.forEach(function(p){
      var entrega = dataEntregaDaOS(p);
      if (!dataValida(entrega) || !dataValida(p.dataPedido) || !dataValida(p.previsaoOriginal)) return;
      var dias = businessDaysBetween(p.dataPedido, entrega);
      var atraso = businessDaysBetween(p.previsaoOriginal, entrega);
      linhas.push({
        id: p.id, os: p.numeroOS || '—', cliente: p.cliente || '', loja: p.loja,
        laboratorio: p.laboratorio || 'Não informado', tipo: tipoLenteLabel(p.tipo),
        dataPedido: p.dataPedido, dataEntrega: entrega, previsao: p.previsaoOriginal,
        novoPrazo: p.contato && p.contato.novaPrevisao || null,
        dias: dias, atraso: Math.max(atraso, 0), noPrazo: atraso <= 0
      });
    });
    return linhas.sort(function(a, b){ return b.dataEntrega.localeCompare(a.dataEntrega); });
  }

  function resumoRelatorio(linhas){
    var n = linhas.length;
    var soma = linhas.reduce(function(s, l){ return s + l.dias; }, 0);
    var noPrazo = linhas.filter(function(l){ return l.noPrazo; }).length;
    var somaAtraso = linhas.reduce(function(s, l){ return s + l.atraso; }, 0);
    return { total: n, media: n ? soma / n : 0, pctNoPrazo: n ? Math.round(100 * noPrazo / n) : 0, atrasoMedio: n ? somaAtraso / n : 0 };
  }

  function fmtDias(v){ return (Math.round(v * 10) / 10).toString().replace('.', ','); }
  function diasUteisTxt(n){ return n + (n === 1 ? ' dia útil' : ' dias úteis'); }

      '<div style="font-size:13px;color:var(--ink-soft);margin-top:4px;">Pedidos já entregues, contados em dias úteis. O atraso é medido contra a previsão original do pedido.</div></div>' +
      lojaFiltroHtml + '</div>';

    if (!linhas.length){
      return cabecalho + '<div class="card" style="text-align:center;color:var(--ink-soft);">Ainda não há pedidos entregues para mostrar. Os números aparecem aqui conforme os óculos forem marcados como “chegou”.</div>' + aviso;
    }

    var geral = resumoRelatorio(linhas);
    function agrupar(campo){
      var grupos = {};
      linhas.forEach(function(l){ (grupos[l[campo]] = grupos[l[campo]] || []).push(l); });
      return Object.keys(grupos).map(function(k){ var r = resumoRelatorio(grupos[k]); r.nome = k; return r; })
        .sort(function(a, b){ return b.media - a.media; });
    }
    function corPct(pct){ return pct < 70 ? 'var(--terracota-dark)' : (pct < 90 ? 'var(--amber-dark)' : 'var(--green-dark)'); }
    function quadro(titulo, grupos){
      return '<div class="card" style="flex:1;min-width:300px;padding:16px 18px;">' +
        '<div style="font-size:15px;font-weight:800;margin-bottom:10px;">'+titulo+'</div>' +
        '<table><thead><tr><th>'+(titulo.indexOf('laboratório') >= 0 ? 'Laboratório' : 'Tipo de lente')+'</th><th>Entregues</th><th>Prazo médio</th><th>Atraso médio</th><th>No prazo</th></tr></thead><tbody>' +
        grupos.map(function(g){
          return '<tr><td style="font-weight:700;">'+escapeHtml(g.nome)+'</td><td>'+g.total+'</td>' +
            '<td>'+fmtDias(g.media)+' d.u.</td>' +
            '<td style="color:'+(g.atrasoMedio > 0 ? 'var(--terracota-dark)' : 'var(--ink-soft)')+';font-weight:'+(g.atrasoMedio > 0 ? 700 : 400)+';">'+(g.atrasoMedio > 0 ? '+' + fmtDias(g.atrasoMedio) + ' d.u.' : '—')+'</td>' +
            '<td style="color:'+corPct(g.pctNoPrazo)+';font-weight:700;">'+g.pctNoPrazo+'%</td></tr>';
        }).join('') +
        '</tbody></table></div>';
    }

    var tabela = '<div class="card" style="padding:0;overflow:auto;margin-top:16px;">' +
      '<table><thead><tr><th>OS</th><th>Cliente</th><th>Laboratório</th><th>Tipo de lente</th><th>Data do pedido</th><th>Data entregue</th><th>Entregue em</th></tr></thead><tbody>' +
      linhas.map(function(l){
        var fundo = l.noPrazo ? 'var(--green-tint)' : 'var(--terracota-tint)';
        var cor = l.noPrazo ? 'var(--green-dark)' : 'var(--terracota-dark)';
        return '<tr data-open="'+l.id+'" style="cursor:pointer;background:'+fundo+';" title="Previsão: '+fmtDate(l.previsao)+(l.novoPrazo ? ' · novo prazo do laboratório: '+fmtDate(l.novoPrazo) : '')+'">' +
          '<td style="font-weight:700;">'+escapeHtml(l.os)+'</td>' +
          '<td>'+escapeHtml(l.cliente)+(state.session.role === 'admin' && state.adminLojaFiltro === 'todas' ? ' <span style="color:var(--ink-soft);font-size:12px;">· '+escapeHtml(l.loja)+'</span>' : '')+'</td>' +
          '<td>'+escapeHtml(l.laboratorio)+'</td>' +
          '<td>'+l.tipo+'</td>' +
          '<td>'+fmtDate(l.dataPedido)+'</td>' +
          '<td>'+fmtDate(l.dataEntrega)+'</td>' +
          '<td style="color:'+cor+';font-weight:700;white-space:nowrap;">'+diasUteisTxt(l.dias) +
            (l.noPrazo ? '' : ' <span style="font-weight:800;">(+'+diasUteisTxt(l.atraso)+')</span>') +
            (l.novoPrazo ? '<div style="font-size:11px;font-weight:400;color:var(--ink-soft);">novo prazo do lab.: '+fmtDate(l.novoPrazo)+'</div>' : '') +
