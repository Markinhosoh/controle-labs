      }).join('') +
      '</tbody></table></div>';

    return cabecalho +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;">' +
        statCard('PRAZO MÉDIO DE ENTREGA', fmtDias(geral.media) + (geral.media === 1 ? ' dia útil' : ' dias úteis'), '#fff', 'var(--ink)') +
        statCard('ENTREGUES NO PRAZO', geral.pctNoPrazo + '%', geral.pctNoPrazo < 70 ? 'var(--terracota-tint)' : 'var(--green-tint)', geral.pctNoPrazo < 70 ? 'var(--terracota-dark)' : 'var(--green-dark)') +
        statCard('OS ENTREGUES', geral.total, '#fff', 'var(--ink)') +
      '</div>' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;">' +
        quadro('Por laboratório', agrupar('laboratorio')) +
        quadro('Por tipo de lente', agrupar('tipo')) +
      '</div>' +
      tabela + aviso;
  }

  // ==== EQUIPES-INICIO ==== (testes/teste-leitor.html também testa este trecho)
  // Índice de execução do processo por loja (só o admin vê). Regras de execução do processo:
  //  • Uso do app: entrar em todo dia útil.
  //  • Importação do PDF: pelo menos 2 vezes por semana.
  //  • Cadastro completo: pedidos criados no período com nome do cliente e laboratório.
  //  • Urgentes: 1ª cobrança em até 1 dia útil depois do checkpoint de urgência.
  //  • Cobrança diária: depois disso, um registro por dia útil até a entrega; um novo prazo informado
  //    pelo laboratório suspende a cobrança até a nova data.
  // Todas as etapas valem igual. Só contam ações feitas com o login da loja. O dia de hoje não entra
  // na nota (ainda não acabou). Antes de INICIO_REGISTRO usa-se o que já estava gravado nos pedidos.
  var TIPOS_COBRANCA = { contato_mesmo: 1, contato_novo: 1, contato_destaque: 1, cobranca_lote: 1, whatsapp: 1 /* botão antigo, até 15/10 */ };
  var ETAPAS_EQUIPE = [
    ['uso', 'Uso do app (todo dia útil)'],
    ['importacao', 'Importação do PDF (2x por semana)'],
    ['cadastro', 'Cadastro completo (nome e laboratório)'],
    ['urgentes', 'Urgentes cobrados em até 1 dia útil'],
    ['diaria', 'Cobrança diária até a entrega']
  ];

  function diasUteisDoIntervalo(ini, fim){
    var lista = [];
    if (!dataValida(ini) || !dataValida(fim) || ini > fim) return lista;
    var d = new Date(ini + 'T00:00:00'), f = new Date(fim + 'T00:00:00');
    while (d <= f){ if (d.getDay() !== 0 && d.getDay() !== 6) lista.push(toISO(d)); d.setDate(d.getDate() + 1); }
    return lista;
  }
  function diaAnterior(dia){ var d = new Date(dia + 'T00:00:00'); d.setDate(d.getDate() - 1); return toISO(d); }

  // períodos: esta semana / semana passada / este mês / mês passado, e o período anterior de cada um
  function periodoEquipe(chave, hoje){
    var h = new Date(hoje + 'T00:00:00');
    function segunda(d){ var x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
    function mais(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
    var ini, fim;
    if (chave === 'semana'){ ini = segunda(h); fim = mais(ini, 6); }
    else if (chave === 'semana_passada'){ ini = mais(segunda(h), -7); fim = mais(ini, 6); }
    else if (chave === 'mes'){ ini = new Date(h.getFullYear(), h.getMonth(), 1); fim = new Date(h.getFullYear(), h.getMonth() + 1, 0); }
    else { ini = new Date(h.getFullYear(), h.getMonth() - 1, 1); fim = new Date(h.getFullYear(), h.getMonth(), 0); }
    return { ini: toISO(ini), fim: toISO(fim) };
  }
  var PERIODO_ANTERIOR = { semana: 'semana_passada', mes: 'mes_passado' };
  function periodoAnteriorEquipe(chave, hoje){
    if (PERIODO_ANTERIOR[chave]) return periodoEquipe(PERIODO_ANTERIOR[chave], hoje);
    var p = periodoEquipe(chave, hoje), d = new Date(p.ini + 'T00:00:00');
    if (chave === 'semana_passada'){ d.setDate(d.getDate() - 7); return { ini: toISO(d), fim: diaAnterior(p.ini) }; }
    return { ini: toISO(new Date(d.getFullYear(), d.getMonth() - 1, 1)), fim: diaAnterior(p.ini) };
  }

  function checkpointUrgencia(p){
    if (!dataValida(p.previsaoOriginal)) return null;
    if (p.tipo === 'especial'){
      var prazoDias = p.prazoDias || businessDaysBetween(p.dataPedido, p.previsaoOriginal);
      return subBusinessDays(p.previsaoOriginal, prazoDias > 3 ? 2 : 1);
    }
    return subBusinessDays(p.previsaoOriginal, 2);
  }
  // dia em que o pedido passou a "valer" para a loja: o checkpoint de urgência, ou o cadastro, se foi depois
  function inicioUrgencia(p){
    var cu = checkpointUrgencia(p);
    if (!cu) return null;
    return dataValida(p.criadoEm) && p.criadoEm > cu ? p.criadoEm : cu;
  }
  function diaDaEntrega(p){ return p.entregue ? (dataEntregaDaOS(p) || (dataValida(p.dataEntrega) ? p.dataEntrega : null)) : null; }

  // dias em que houve cobrança de cada pedido (registro da loja; antes do registro, o que está no pedido)
  function mapaCobrancas(pedidos, atividades){
    var mapa = {};
    function add(id, dia){ if (dataValida(dia)) (mapa[id] = mapa[id] || {})[dia] = true; }
    atividades.forEach(function(a){ if (a.por === 'loja' && TIPOS_COBRANCA[a.tipo] && a.pedidoId) add(a.pedidoId, a.dia); });
    pedidos.forEach(function(p){
      var antigos = [];
      if (p.contato && p.contato.registradoEm) antigos.push(p.contato.registradoEm);
      Object.keys(p.lembretes || {}).forEach(function(d){ antigos.push(d); });
      Object.keys(p.historico || {}).forEach(function(d){ antigos.push(d); });
      antigos.forEach(function(d){ if (d < INICIO_REGISTRO) add(p.id, d); });
    });
    return mapa;
  }
  // períodos em que o laboratório deu novo prazo: não há cobrança diária entre o registro e a nova data
  function suspensoesDoPedido(p, atividades){
    var lista = [];
    if (p.contato && p.contato.tipo === 'novo' && dataValida(p.contato.registradoEm) && dataValida(p.contato.novaPrevisao)) lista.push([p.contato.registradoEm, p.contato.novaPrevisao]);
    atividades.forEach(function(a){ if (a.pedidoId === p.id && a.tipo === 'contato_novo' && dataValida(a.dia) && dataValida(a.novaPrevisao)) lista.push([a.dia, a.novaPrevisao]); });
    return lista;
  }
  function cobrancaExigida(p, dia, suspensoes){
    var base = inicioUrgencia(p);
    if (!base) return false;
    var desde = addBusinessDays(base, 1);
    if (dia < desde) return false;
    var ent = diaDaEntrega(p);
    if (ent && dia >= ent) return false;
    return !suspensoes.some(function(s){ return dia > s[0] && dia < s[1]; });
  }

  function calcularEquipes(pedidos, atividades, ini, fim, hoje){
    var ontem = diaAnterior(hoje);
    var avaliados = diasUteisDoIntervalo(ini, fim < ontem ? fim : ontem); // hoje fica de fora
    var cobr = mapaCobrancas(pedidos, atividades);
    var resultado = {};
    LOJAS.forEach(function(loja){
      var pedsL = pedidos.filter(function(p){ return p.loja === loja; });
      var atvL = atividades.filter(function(a){ return a.loja === loja && a.por === 'loja'; });
      var etapas = {};

      // 1. uso do app — só existe registro a partir de INICIO_REGISTRO
      var diasUso = avaliados.filter(function(d){ return d >= INICIO_REGISTRO; });
      var usados = {}; atvL.forEach(function(a){ usados[a.dia] = true; });
      var nUso = diasUso.filter(function(d){ return usados[d]; }).length;
      etapas.uso = diasUso.length ? { feito: nUso, total: diasUso.length, txt: nUso + ' de ' + diasUso.length + ' dias úteis com uso' } : null;

      // 2. importação — dias distintos com PDF importado (hoje conta como feito)
      var fimImp = fim < hoje ? fim : hoje;
      var diasImp = {};
      atvL.forEach(function(a){ if (a.tipo === 'importacao' && a.dia >= ini && a.dia <= fimImp) diasImp[a.dia] = true; });
      pedsL.forEach(function(p){ if (p.origemImportacao && dataValida(p.criadoEm) && p.criadoEm < INICIO_REGISTRO && p.criadoEm >= ini && p.criadoEm <= fimImp) diasImp[p.criadoEm] = true; });
      var nImp = Object.keys(diasImp).length;
      var esperadas = avaliados.length ? Math.max(1, Math.round(avaliados.length * 2 / 5)) : 0;
      etapas.importacao = esperadas ? { feito: Math.min(nImp, esperadas), total: esperadas, txt: nImp + ' importaç' + (nImp === 1 ? 'ão' : 'ões') + ' (meta: ' + esperadas + ')' } : null;

      // 3. cadastro completo — pedidos criados no período
      var criados = pedsL.filter(function(p){ return dataValida(p.criadoEm) && p.criadoEm >= ini && p.criadoEm <= fim; });
      var completos = criados.filter(function(p){ return !clienteSemNome((p.cliente || '').trim()) && p.laboratorio && p.laboratorio !== 'Não informado'; }).length;
      etapas.cadastro = criados.length ? { feito: completos, total: criados.length, txt: completos + ' de ' + criados.length + ' pedidos novos completos' } : null;

      // 4. urgentes cobrados em até 1 dia útil
      var okU = 0, falhaU = 0, pendentesU = 0;
      pedsL.forEach(function(p){
        var base = inicioUrgencia(p);
        if (!base || base < ini || base > fim) return;
        var ent = diaDaEntrega(p);
        if (ent && ent <= base) return; // chegou antes de ficar urgente
        var prazo = addBusinessDays(base, 1);
        var dias = Object.keys(cobr[p.id] || {});
        if (dias.some(function(d){ return d <= prazo; })){ okU++; return; }
        if (prazo >= hoje){ pendentesU++; return; } // ainda dá tempo
        if (ent && ent <= prazo) return;              // chegou dentro do prazo de cobrança
        falhaU++;
      });
      etapas.urgentes = (okU + falhaU) ? { feito: okU, total: okU + falhaU, txt: okU + ' de ' + (okU + falhaU) + ' cobrados a tempo' + (pendentesU ? ' · ' + pendentesU + ' ainda no prazo' : '') } : null;

      // 5. cobrança diária (pedido × dia útil)
      var exigidos = 0, feitos = 0;
      pedsL.forEach(function(p){
        var susp = suspensoesDoPedido(p, atividades);
        avaliados.forEach(function(d){
          if (dataValida(p.criadoEm) && d < p.criadoEm) return;
          if (!cobrancaExigida(p, d, susp)) return;
          exigidos++;
          if (cobr[p.id] && cobr[p.id][d]) feitos++;
        });
      });
      etapas.diaria = exigidos ? { feito: feitos, total: exigidos, txt: feitos + ' de ' + exigidos + ' cobranças diárias feitas' } : null;

      var notas = ETAPAS_EQUIPE.map(function(e){ var x = etapas[e[0]]; if (x) x.pct = Math.round(100 * x.feito / x.total); return x ? x.pct : null; })
        .filter(function(v){ return v !== null; });
      var contagem = {};
      atvL.forEach(function(a){ if (a.dia >= ini && a.dia <= fim) contagem[a.tipo] = (contagem[a.tipo] || 0) + 1; });
      resultado[loja] = { etapas: etapas, indice: notas.length ? Math.round(notas.reduce(function(s, v){ return s + v; }, 0) / notas.length) : null, contagem: contagem };
    });
    return { lojas: resultado, diasAvaliados: avaliados.length };
  }

  // pedidos que hoje precisam de cobrança e ficaram sem nenhuma no último dia útil
  function pedidosDeixadosDeLado(pedidos, atividades, hoje){
    var cobr = mapaCobrancas(pedidos, atividades);
    var ontemUtil = subBusinessDays(hoje, 1);
    var lista = [];
    pedidos.forEach(function(p){
      if (p.entregue) return;
      var susp = suspensoesDoPedido(p, atividades);
      if (!cobrancaExigida(p, hoje, susp) || !cobrancaExigida(p, ontemUtil, susp)) return;
      var dias = Object.keys(cobr[p.id] || {}).sort();
      var ultima = dias.length ? dias[dias.length - 1] : null;
      if (ultima && ultima >= ontemUtil) return;
      var desde = addBusinessDays(inicioUrgencia(p), 1);
      var semCobrar = businessDaysBetween(ultima && ultima > desde ? ultima : diaAnterior(desde), hoje);
      lista.push({ p: p, ultima: ultima, semCobrar: semCobrar });
    });
    return lista.sort(function(a, b){ return b.semCobrar - a.semCobrar; });
  }
  // ==== EQUIPES-FIM ====

  async function carregarAtividades(){
    var hoje = todayStr();
    var chave = state.equipesPeriodo || 'semana';
    var desde = periodoAnteriorEquipe(chave, hoje).ini;
    if (state.equipes && state.equipes.desde <= desde && !state.equipes.erro && (Date.now() - state.equipes.em) < 60000) return;
    state.equipes = Object.assign({}, state.equipes, { carregando: true, erro: null });
    render();
    try{
      var snap = await comTempoLimite(getDocs(query(collection(fs, 'atividades'), where('dia', '>=', desde))), 20000, MSG_SEM_CONEXAO);
      state.equipes = { carregando: false, erro: null, desde: desde, em: Date.now(), atividades: snap.docs.map(function(d){ return d.data(); }) };
    } catch(e){
      state.equipes = { carregando: false, erro: 'Não foi possível carregar as atividades: ' + e.message, desde: desde, em: 0, atividades: [] };
    }
    render();
  }

  // ---------- quem abriu o app (horário da 1ª abertura de cada loja por dia) ----------
  function horaSP(iso){
    try{ return new Intl.DateTimeFormat('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'}).format(new Date(iso)); }
    catch(e){ return '—'; }
  }
  function aberturasPorDia(atividades){
    var mapa = {};
    (atividades || []).forEach(function(a){
      if (a.tipo !== 'acesso' || a.por !== 'loja' || !a.loja || !dataValida(a.dia) || !a.quando) return;
      var d = (mapa[a.dia] = mapa[a.dia] || {});
      var x = d[a.loja];
      if (!x) d[a.loja] = { primeira: a.quando, ultima: a.quando, vezes: 1 };
      else { if (a.quando < x.primeira) x.primeira = a.quando; if (a.quando > x.ultima) x.ultima = a.quando; x.vezes++; }
    });
    return mapa;
  }
  function aberturasHtml(atividades, hoje){
    var mapa = aberturasPorDia(atividades);
    var dias = [];
    var d = new Date(hoje + 'T00:00:00');
    while (dias.length < 7){
      var iso = toISO(d);
      if (d.getDay() !== 0 || mapa[iso]) dias.push(iso);
      d.setDate(d.getDate() - 1);
    }
    var nomesDia = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
    var cardsHoje = LOJAS.map(function(loja){
      var x = mapa[hoje] && mapa[hoje][loja];
      return '<div style="flex:1;min-width:180px;padding:12px 14px;border-radius:10px;background:'+(x ? 'var(--green-tint)' : 'var(--terracota-tint)')+';">' +
        '<div style="font-size:12px;font-weight:700;color:var(--ink-soft);">'+escapeHtml(loja)+'</div>' +
        (x ? '<div style="font-size:24px;font-weight:800;color:var(--green-dark);">'+horaSP(x.primeira)+'</div>' +
             '<div style="font-size:11px;color:var(--ink-soft);">abriu hoje'+(x.vezes > 1 ? ' · '+x.vezes+' computadores/celulares' : '')+'</div>'
           : '<div style="font-size:18px;font-weight:800;color:var(--terracota-dark);">Ainda não abriu</div>' +
             '<div style="font-size:11px;color:var(--ink-soft);">nenhum acesso hoje</div>') +
      '</div>';
    }).join('');
    var linhas = dias.map(function(dia){
      var dt = new Date(dia + 'T00:00:00');
      return '<tr><td style="font-weight:700;">'+nomesDia[dt.getDay()]+' '+fmtDate(dia)+(dia === hoje ? ' (hoje)' : '')+'</td>' +
        LOJAS.map(function(loja){
          var x = mapa[dia] && mapa[dia][loja];
          return x ? '<td style="font-weight:700;color:var(--green-dark);">'+horaSP(x.primeira)+'</td>' : '<td style="color:var(--terracota-dark);">não abriu</td>';
        }).join('') + '</tr>';
    }).join('');
    return '<div class="card" style="margin-bottom:16px;display:flex;flex-direction:column;gap:12px;">' +
      '<div><div style="font-size:15px;font-weight:800;">Quem abriu o app</div>' +
      '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">Horário em que cada loja abriu o app de controle pela primeira vez no dia (login da loja; o acesso do admin não conta).</div></div>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;">'+cardsHoje+'</div>' +
      '<div style="overflow:auto;"><table><thead><tr><th>Dia</th>'+LOJAS.map(function(l){ return '<th>'+escapeHtml(l)+'</th>'; }).join('')+'</tr></thead><tbody>'+linhas+'</tbody></table></div>' +
    '</div>';
  }

  function viewEquipes(){
    var hoje = todayStr();
    var chave = state.equipesPeriodo || 'semana';
    var per = periodoEquipe(chave, hoje), ant = periodoAnteriorEquipe(chave, hoje);
    var botoes = [['semana', 'Esta semana'], ['semana_passada', 'Semana passada'], ['mes', 'Este mês'], ['mes_passado', 'Mês passado']].map(function(o){
      return '<button data-periodo="' + o[0] + '" class="btn ' + (chave === o[0] ? 'btn-primary' : 'btn-outline') + '" style="padding:8px 14px;">' + o[1] + '</button>';
    }).join('');

  function itensSelecionados(g){ return g.itens.filter(function(it){ return state.cobranca.sel[it.p.id]; }); }

  async function marcarCobradosHoje(chave){
    var hoje = todayStr();
    var g = gruposCobranca(escopoPedidos(), hoje).filter(function(x){ return x.chave === chave; })[0];
    if (!g) return;
    var itens = itensSelecionados(g);
    state.cobranca.salvando = chave; state.cobranca.erro = null; render();
    var feitos = 0;
    try{
      for (var i = 0; i < itens.length; i++){
        var p = itens[i].p;
        var patch = { lembretes: {} };
        patch.lembretes[hoje] = true;
        if (!(p.historico && p.historico[hoje])){ // não apaga uma observação já registrada hoje
          patch.historico = {}; patch.historico[hoje] = { observacao: 'Cobrança enviada ao laboratório (em lote)', registradoEm: hoje };
        }
        await gravar(doc(fs, 'pedidos', p.id), patch, { merge: true });
        registrarAtividade('cobranca_lote', p);
        state.cobranca.sel[p.id] = false;
        feitos++;
      }
      state.cobranca.feito[chave] = feitos;
    } catch(e){
      state.cobranca.erro = { chave: chave, msg: (feitos ? feitos + ' de ' + itens.length + ' marcados. ' : '') + 'Erro: ' + e.message };
    }
    state.cobranca.salvando = null; render();
  }

  // Copia para a área de transferência: tenta o jeito moderno e, se o navegador recusar, o clássico.
  function copiarTextoClassico(texto){
    var ta = document.createElement('textarea'); ta.value = texto; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false; try{ ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    return ok;
  }
  function copiarTexto(texto){
    return new Promise(function(ok, falha){
      function classico(){ copiarTextoClassico(texto) ? ok() : falha(new Error('cópia bloqueada')); }
      if (navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(texto).then(ok, classico);
      } else classico();
    });
  }

  // A tela é redesenhada inteira a cada mudança. Para não perder o que a pessoa está digitando,
  // guardamos o valor de cada campo (e o foco/cursor) antes e devolvemos depois.
  function render(){
    renderPendente = false;
    var campos = capturarCampos();
    desenhar();
    restaurarCampos(campos);
  }

  function capturarCampos(){
    var app = document.getElementById('app');
    var r = { valores: {}, foco: null, rolagem: {} };
    app.querySelectorAll('input[id], select[id], textarea[id]').forEach(function(el){
      if (el.type === 'file') return;
      r.valores[el.id] = el.type === 'checkbox' ? { checked: el.checked } : { value: el.value };
    });
    var ativo = document.activeElement;
    if (ativo && ativo.id && app.contains(ativo) && /^(INPUT|TEXTAREA|SELECT)$/.test(ativo.tagName)){
      r.foco = { id: ativo.id };
      try{ r.foco.ini = ativo.selectionStart; r.foco.fim = ativo.selectionEnd; } catch(e){}
    }
    ['imp-lista'].forEach(function(id){ var el = document.getElementById(id); if (el) r.rolagem[id] = el.scrollTop; });
    var modal = app.querySelector('.modal'); if (modal) r.rolagemModal = modal.scrollTop;
    return r;
  }

  function restaurarCampos(r){
    Object.keys(r.valores).forEach(function(id){
      var el = document.getElementById(id);
      if (!el || el.type === 'file' || id === 'busca-os') return; // a busca vive em state.busca
      var v = r.valores[id];
      if ('checked' in v) el.checked = v.checked;
      else if (el.value !== v.value) el.value = v.value;
    });
    if (r.foco){
      var el = document.getElementById(r.foco.id);
      if (el){
        el.focus({ preventScroll: true });
        try{ if (r.foco.ini != null) el.setSelectionRange(r.foco.ini, r.foco.fim); } catch(e){}
      }
    }
    function aplicarRolagem(){
      Object.keys(r.rolagem).forEach(function(id){ var el = document.getElementById(id); if (el) el.scrollTop = r.rolagem[id]; });
      var modal = document.querySelector('#app .modal'); if (modal && r.rolagemModal != null) modal.scrollTop = r.rolagemModal;
    }
    aplicarRolagem();
    setTimeout(aplicarRolagem, 20); // de novo depois do destaque das linhas sem nome, que muda a altura

  }

  // Atualizações que chegam do banco (outra loja salvou algo) esperam o clique terminar
  // ou a lista de opções fechar, para não sumir com o botão debaixo do mouse.
  var ponteiroPressionado = false, renderPendente = false;
  function selectEmUso(){ var a = document.activeElement; return !!(a && a.tagName === 'SELECT'); }
  function renderDoBanco(){
    if (ponteiroPressionado || selectEmUso()){ renderPendente = true; return; }
    render();
  }
  function descarregarRender(){
    if (renderPendente && !ponteiroPressionado && !selectEmUso()) render();
  }
  document.addEventListener('pointerdown', function(){ ponteiroPressionado = true; }, true);
  ['pointerup', 'pointercancel'].forEach(function(ev){
    document.addEventListener(ev, function(){ ponteiroPressionado = false; setTimeout(descarregarRender, 80); }, true);
  });
  document.addEventListener('focusout', function(){ setTimeout(descarregarRender, 80); }, true);
  document.addEventListener('change', function(){ setTimeout(descarregarRender, 80); }, true);

  function desenhar(){
    var app = document.getElementById('app');
    if (!state.dbReady){
      app.innerHTML = state.error
        ? '<div style="padding:60px;text-align:center;"><div class="card" style="max-width:480px;margin:0 auto;">'+escapeHtml(state.error)+'</div></div>'
        : 'Carregando…';
      return;
    }
    if (!state.session){
      app.innerHTML = avisoVersaoHtml() + viewLogin();
      attachHandlers();
      return;
    }
    var body = state.view === 'dashboard' ? viewDashboard()
      : state.view === 'detalhe' ? viewDetalhe()
      : (state.view === 'equipes' && state.session.role === 'admin') ? viewEquipes()
      : state.view === 'destaque' ? viewDestaque()
      : state.view === 'avisos' ? viewAvisos()

    var errorBanner = state.error ? '<div style="background:var(--terracota-tint);color:var(--terracota-dark);padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:12px;">'+escapeHtml(state.error)+' <button id="dismiss-error" style="font-weight:700;text-decoration:underline;">fechar</button></div>' : '';

    app.innerHTML =
      '<div style="min-height:100vh;display:flex;flex-direction:column;">' +
        avisoVersaoHtml() + header() +
        '<div style="flex:1;padding:28px 32px;">' + errorBanner + body + '</div>' +
        '<div style="padding:0 32px 18px;font-size:11px;color:var(--ink-soft);opacity:0.75;">' + escapeHtml(MARCA.nome) + ' · Controle de Prazos · versão ' + VERSAO_APP + '</div>' +
      '</div>' +
      '<button id="fab-novo" class="fab">+ Novo Pedido</button>' +
      (state.modal === 'novo' ? modalNovoPedido() : '') +
      (state.modal === 'codigos' ? modalCodigos() : '') +
      (state.modal === 'cobranca' && state.cobranca ? modalCobranca() : '') +
      (state.modal === 'importarPdf' ? modalImportarPdf() : '');

    attachHandlers();
  }

        if (incl) c.incluir = incl.checked;
        if (cli) c.cliente = cli.value;
        if (loja) c.loja = loja.value;
        if (tipo) c.tipo = tipo.value;
        if (prazo) c.prazoDias = prazo.value;
        if (qtd) c.quantidade = qtd.value;
      });
      (state.pdfCorrecoes || []).forEach(function(c, i){
        var incl = document.getElementById('cor-incluir-'+i), cli = document.getElementById('cor-cliente-'+i);
        if (incl) c.incluir = incl.checked;
        if (cli) c.cliente = cli.value.trim();
      });
    }
    document.querySelectorAll('.imp-tipo-select').forEach(function(sel){
      sel.addEventListener('change', function(){
        sincronizarCandidatosPdf();
        state.pdfCandidatos[parseInt(sel.getAttribute('data-idx'), 10)].tipo = sel.value;
        render();
      });
    });
    document.querySelectorAll('.imp-qtd-input').forEach(function(inp){
      inp.addEventListener('change', function(){
        sincronizarCandidatosPdf();
        state.pdfCandidatos[parseInt(inp.getAttribute('data-idx'), 10)].quantidade = inp.value;
        render();
      });
    });
    // Nenhum pedido entra sem nome do cliente: linha selecionada sem nome fica vermelha
    // e o botão de salvar trava. Roda a cada tecla, sem redesenhar a tela.
    function validarImportacao(){
      var botao = document.getElementById('salvar-importados');
      if (!botao) return;
      var invalidas = 0;
      document.querySelectorAll('#imp-lista .imp-linha').forEach(function(linha){
        var pref = linha.id.indexOf('cor-') === 0 ? 'cor' : 'imp';
        var i = linha.id.split('-').pop();
        var incl = document.getElementById(pref + '-incluir-' + i);
        var cli = document.getElementById(pref + '-cliente-' + i);
        var ruim = !!(incl && incl.checked && cli && clienteSemNome(cli.value.trim()));
        linha.classList.toggle('invalida', ruim);
        if (ruim) invalidas++;
      });
      botao.disabled = state.saving || invalidas > 0;
      botao.style.opacity = botao.disabled ? '0.5' : '';
      botao.style.cursor = botao.disabled ? 'not-allowed' : '';
      var aviso = document.getElementById('imp-aviso');
      if (aviso) aviso.textContent = invalidas
        ? (invalidas === 1 ? '1 linha selecionada está' : invalidas + ' linhas selecionadas estão') + ' sem nome do cliente (em vermelho). Preencha o nome ou desmarque a linha para poder salvar.'
        : '';
    }
    document.querySelectorAll('#imp-lista input[id^="imp-cliente-"], #imp-lista input[id^="cor-cliente-"]').forEach(function(el){
      el.addEventListener('input', validarImportacao);
    });
    document.querySelectorAll('#imp-lista input[id^="imp-incluir-"], #imp-lista input[id^="cor-incluir-"]').forEach(function(el){
      el.addEventListener('change', validarImportacao);
    });
    if (document.getElementById('imp-lista')) setTimeout(validarImportacao, 0);

    var cancelarImportar = document.getElementById('cancelar-importar');
    if (cancelarImportar) cancelarImportar.addEventListener('click', function(){ state.modal = null; state.pdfCandidatos = []; state.pdfCorrecoes = []; state.importErro = null; render(); });
    var salvarImportadosBtn = document.getElementById('salvar-importados');
    if (salvarImportadosBtn) salvarImportadosBtn.addEventListener('click', function(){
      sincronizarCandidatosPdf();
      salvarImportados(state.pdfCandidatos);
    });

    // ---- Cobrança em lote ----
    var btnCobrarLabs = document.getElementById('btn-cobrar-labs');
    if (btnCobrarLabs) btnCobrarLabs.addEventListener('click', abrirCobranca);
    var fecharCobranca = document.getElementById('fechar-cobranca');
    if (fecharCobranca) fecharCobranca.addEventListener('click', function(){ state.modal = null; state.cobranca = null; render(); });
    document.querySelectorAll('[data-cob-sel]').forEach(function(el){
      el.addEventListener('change', function(){
        state.cobranca.sel[el.getAttribute('data-cob-sel')] = el.checked;
        state.cobranca.copiado = {}; // a mensagem mudou: precisa copiar de novo
        render();
      });
    });
    document.querySelectorAll('[data-cob-copiar]').forEach(function(el){
      el.addEventListener('click', function(){
        var chave = el.getAttribute('data-cob-copiar');
        var g = gruposCobranca(escopoPedidos(), todayStr()).filter(function(x){ return x.chave === chave; })[0];
        if (!g) return;
        copiarTexto(mensagemLote(g, itensSelecionados(g))).then(function(){
          state.cobranca.copiado[chave] = true; render();
        }).catch(function(){
          var ta = el.closest('div').parentNode.querySelector('textarea.cob-msg');
          if (ta){ ta.focus(); ta.select(); }
          window.alert('O navegador não deixou copiar sozinho. A mensagem ficou selecionada: aperte Ctrl+C para copiar.');
        });
      });
    });
    document.querySelectorAll('[data-cob-marcar]').forEach(function(el){
      el.addEventListener('click', function(){ marcarCobradosHoje(el.getAttribute('data-cob-marcar')); });
    });

    var btnAtualizarApp = document.getElementById('btn-atualizar-app');
    if (btnAtualizarApp) btnAtualizarApp.addEventListener('click', function(){ location.reload(); });
    var btnCodigos = document.getElementById('btn-codigos');
    if (btnCodigos) btnCodigos.addEventListener('click', function(){ state.modal = 'codigos'; state.codigosErro = null; render(); });
    var cancelarCodigos = document.getElementById('cancelar-codigos');
    if (cancelarCodigos) cancelarCodigos.addEventListener('click', function(){ state.modal = null; state.codigosErro = null; render(); });
    var salvarCodigos = document.getElementById('salvar-codigos');
    if (salvarCodigos) salvarCodigos.addEventListener('click', function(){
      var cods = {};
      document.querySelectorAll('[data-cod-loja]').forEach(function(el){
        var loja = el.getAttribute('data-cod-loja');
        // loja só grava os próprios códigos
        if (state.session.role !== 'admin' && loja !== state.session.loja) return;
        (cods[loja] = cods[loja] || {})[el.getAttribute('data-cod-lab')] = el.value.trim();
      });
      salvarCodigosLabs(cods);
    });

    var dismiss = document.getElementById('dismiss-error');
    if (dismiss) dismiss.addEventListener('click', function(){ state.error = null; render(); });
  }

  init();
})();
</script>
</body>
</html>
